<script>
const V='B';
const names={A:'便签气泡',B:'回复框即草稿',C:'待发区 + 所见即所得',D:'顶部横幅 + 底部抽屉'};
const scenes=['回复草稿（标了交付）','说明修订草稿','直接修改中','发出：草稿后有新变化','工单已关闭','说明版本冲突','发出后'];
let scene=1, editing=false, showHistory=false, drawer=false, toastTimer=null, modal=null;
const replyText='已定位：导出时按 UTC 截断日期，跨零点的记录会错到前一天。\n修复已上线测试环境，请用附件样例再导出一次确认：\n- 日期列现在按本地时区（UTC+8）\n- 旧报表需重新导出';
const revisionText='说明将修订为第 5 版，改动：\n标题：导出报表时日期列错位（跨零点记录）\n复现步骤：导出 9 月报表，看 9/30 23:30 之后的记录\n附件：+ tz-log.txt';
const command='请修改 agent-taskboard 工单 #128 上你写的回复草稿（草稿 第 2 版）。先读取当前草稿全文（我可能手动改过），然后按我接下来的意见修改，原地保存草稿；改完把草稿查看地址发给我。';
let isReply=true, hasDraft=true, danger=false, draftTitle='回复草稿', sendText='发出';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draftBody(){if(editing)return `<div class="paper"><textarea>${isReply?esc(replyText):esc(revisionText)}</textarea><div style="margin:8px 0 6px"><span class="chip editchip">📎 export-sample.xlsx ✕</span> <button class="chip editchip">＋ 附件</button></div><p class="hint">保存后记为第 3 版「allan 修改」；发出时署名为「经 allan 修改并确认」。Agent 再改会基于你这一版。</p></div>`;return isReply?`<div class="draftbody"><p><b>已定位：</b>导出时按 UTC 截断日期，<b>跨零点</b>的记录会错到前一天。</p><p>修复已上线测试环境，请用附件样例再导出一次确认：</p><ol><li>日期列现在按本地时区（UTC+8）</li><li>旧报表需重新导出</li></ol><div style="margin-top:8px"><span class="chip">📎 export-sample.xlsx</span></div></div>`:`<div class="fields"><div class="change"><div class="q">标题</div><div class="row"><span class="old">导出报表日期错位</span>→<span class="new">导出报表时日期列错位（跨零点记录）</span></div></div><div class="change"><div class="q">复现步骤</div><div class="row"><span class="old">导出 9 月报表</span>→<span class="new">导出 9 月报表，看 9/30 23:30 之后的记录</span></div></div><div class="change"><div class="q">期望结果</div><div class="same">未修改</div></div><div class="change"><div class="q">附件</div><span class="new">+ tz-log.txt</span></div></div>`}
function draftWho(){return isReply?`<div class="draftwho"><b>codex-1（你的 Agent）</b>写的回复草稿 · 第 2 版 · 10:42 <span class="pill">将作为交付</span></div>`:`<div class="draftwho"><b>codex-1（你的 Agent）</b>写的说明修订草稿 · 基于说明第 4 版 · 10:42</div>`}
function draftOps(){const common=editing?`<button class="ghost" onclick="exitEdit()">取消</button><button class="primary" onclick="exitEdit()">保存草稿</button>`:`<button class="danger" onclick="openModal('discard')">丢弃</button><button class="ghost" onclick="copyCommand()">复制修改指令</button><button class="ghost" onclick="startEdit()">直接修改</button>${isReply?'<button class="toggle">✓ 作为交付发出</button>':''}<button class="primary" ${danger?'disabled':''} onclick="sendDraft()">${sendText}</button>`;return common}
function redNotice(){return danger?`<div class="notice">${scene==5?'工单已关闭，回复草稿不能发出。重新开启工单后可以发出，或者丢弃这份草稿。':'说明已被 李四 修订到第 5 版，这份草稿基于第 4 版，不能发出。可以复制修改指令让 Agent 按第 5 版重写，或者丢弃。'}</div>`:''}
function baseFlow(){const v=scene==6?5:4;let s=`<div class="msg"><div class="avatar v">王</div><div class="bubble"><div class="who"><b>王工（访客）</b> · 说明 · 第 ${v} 版</div><div class="fields"><div class="field"><div class="q">标题是什么？</div>导出报表日期错位</div><div class="field"><div class="q">怎么复现？</div>导出 9 月报表</div><div class="field"><div class="q">期望结果？</div>日期与系统里一致</div></div></div></div><div class="event">allan 指派给 allan · 10/20 09:12</div><div class="msg"><div class="avatar m">A</div><div class="bubble"><div class="who"><b>allan（成员）</b> · 10/20 09:30</div><p>收到，让 Agent 先查一下。</p></div></div><div class="msg"><div class="avatar v">王</div><div class="bubble"><div class="who"><b>王工（访客）</b> · 10/21 08:05</div><p>今天又导了一次，还是错的，主要是月底那几天。</p></div></div>`;
if(scene==4)s+=`<div class="dashed">↓ 草稿写成（10:42）之后的新变化</div><div class="msg"><div class="avatar v">王</div><div class="bubble"><div class="who"><b>王工（访客）</b> · 10:55</div><p>补充：9/30 晚上的单子全部变成 9/29 了。</p></div></div><div class="event">王工 上传了附件 0930.png · 10:56</div>`;
if(scene==5)s+=`<div class="event">李四 关闭了工单（已解决） · 10:50</div>`;
if(scene==6)s+=`<div class="event">李四 修订了说明（第 5 版） · 10:48</div>`;
return s}
function formalReply(){return `<div class="msg"><div class="avatar a">C<span>🤖</span></div><div class="bubble"><div class="who"><b>allan 的 Agent · codex-1</b> · 经 allan 修改并确认 · 10:58 <span class="pill">交付</span></div><div class="draftbody"><p><b>已定位：</b>导出时按 UTC 截断日期，<b>跨零点</b>的记录会错到前一天。</p><p>修复已上线测试环境，请用附件样例再导出一次确认：</p><ol><li>日期列现在按本地时区（UTC+8）</li><li>旧报表需重新导出</li></ol><div style="margin-top:8px"><span class="chip">📎 export-sample.xlsx</span></div></div><button class="link" onclick="toggleHistory()">${showHistory?'收起起草过程':'查看起草过程（2 版）'}</button>${showHistory?`<div class="history"><div>第 1 版 · codex-1 写 · 10:42 · 查看</div><div>第 2 版 · allan 修改 · 10:50 · 查看 · 与上一版对比</div><div>发出 · allan 确认 · 10:58</div><div style="color:#888;font-size:12px">起草过程只有工单可见范围内的成员能看，访客看不到。</div></div>`:''}</div></div>`}
function draftA(){return `<div class="msg"><div class="avatar a" style="opacity:.55;border:2px dashed #7c6cd8">C</div><div class="draftcard"><span class="tag">草稿 · 未发出 · 只有你能看到</span>${draftWho()}${draftBody()}${redNotice()}<div class="ops">${draftOps()}</div></div></div>`}
function draftB(){return `<div class="ban">发出后会出现在上方对话里</div><section class="draftpanel"><div class="panelhead"><span>✎ ${draftTitle} · 未发出</span><span class="only">只有你能看到</span></div><div class="ver">${isReply?'第 2 版 · codex-1 写于 10:42 · Agent 标记作为交付':'基于说明第 4 版 · codex-1 写于 10:42'}</div>${isReply?'<div class="agentmark">Agent 标记：作为交付发出</div>':''}<div class="draftframe">${draftBody()}</div>${redNotice()}<div class="ops">${draftOps()}</div><div class="lockfoot">有草稿期间你和你的 Agent 都不能直接回复或修订说明。</div></section>`}
function draftC(){return `<div class="pending"><span>以下尚未发出 · 只有你能看到</span></div><div class="preview-wrap"><div class="preview-label">发出后会这样显示：</div><div class="preview ${editing?'opaque':''}"><div class="msg"><div class="avatar a">C<span>🤖</span></div><div style="position:relative;flex:1;min-width:0"><div class="watermark">草稿</div><div class="bubble"><div class="who"><b>${isReply?'allan 的 Agent · codex-1 · 经 allan 确认 · 发出时间':'说明将修订为第 5 版，改动：'}</b>${isReply?' <span class="pill">交付</span>':''}</div>${draftBody()}</div></div></div></div><div class="ver" style="margin-top:6px">${isReply?'回复草稿 · 第 2 版 · codex-1 写于 10:42 · Agent 标记作为交付':'说明修订草稿 · 基于说明第 4 版 · codex-1 写于 10:42'}</div></div>`}
function draftD(){return `<div class="drawer-mask" onclick="closeDrawer()"></div><section class="drawer"><div class="grab"></div><div class="drawer-head"><b>✎ ${draftTitle}</b><span class="only">未发出 · 只有你能看到</span><button class="plain" onclick="closeDrawer()">收起</button></div><div class="ver">${isReply?'第 2 版 · codex-1 写于 10:42 · Agent 标记作为交付':'基于说明第 4 版 · codex-1 写于 10:42'}</div><div class="paperbox">${draftBody()}</div>${redNotice()}<div class="ops">${draftOps()}</div></section>`}
function locked(withLink=true){return `<div class="lock">🔒 你在这张工单上有一份草稿，发出或丢弃后才能直接回复或修订说明。${withLink?' <a href="#" onclick="jumpDraft();return false">↑ 跳到草稿</a>':''}</div>`}
function normalReply(){return `<section class="reply"><textarea placeholder="回复王工…"></textarea><div class="foot"><button class="ghost">＋ 附件</button><button class="ghost">标记为交付</button><button class="primary">发送</button></div></section>`}
function bottomArea(){if(scene==7)return normalReply();if(V=='A')return locked(true);if(V=='B')return draftB();if(V=='C')return locked(false);return `<div class="lock">🔒 你在这张工单上有一份草稿，发出或丢弃后才能直接回复或修订说明。 <a href="#" onclick="openDrawer();return false">打开草稿</a></div>`}
function render(){document.querySelectorAll('.modal-mask,.actionbar,.drawer,.drawer-mask').forEach(e=>e.remove());isReply=[1,3,4,5].includes(scene);hasDraft=scene<=6;danger=scene>=5;draftTitle=isReply?'回复草稿':'说明修订草稿';sendText=isReply?'发出':'发出修订';document.body.className='cand-'+V.toLowerCase();document.title=`工单 #128 · 候选 ${V}`;document.querySelector('.bar b').textContent=`原型 · 候选 ${V}：${names[V]}`;document.getElementById('scenes').innerHTML=scenes.map((s,i)=>`<button class="scene ${scene==i+1?'on':''}" onclick="setScene(${i+1})">${i+1}. ${s}</button>`).join('');let bottom=bottomArea(),fixed='';let flow=baseFlow();
if(V=='A'&&hasDraft)flow+=draftA();
if(V=='C'&&hasDraft){flow+=draftC();fixed=`<div class="actionbar"><div class="action-inner"><div class="action-title">✎ ${draftTitle} · 第 2 版 · codex-1 写于 10:42</div><div style="display:flex;gap:7px;flex-wrap:wrap">${redNotice()?`<div class="bar-notice">${redNotice().replace(/<[^>]+>/g,'')}</div>`:''}${draftOps()}</div></div></div>`}
let app=`<header class="card head"><h1>#128 导出报表时日期列错位</h1><div class="meta"><span class="badge ${scene==5?'closed':'wait'}">${scene==5?'已关闭':'等待访客'}</span><span>访客 王工</span><span>指派 allan</span>${hasDraft?`<span class="badge draftbadge">✎ 有${draftTitle}待你确认</span>`:''}</div>${V=='D'&&hasDraft?`<div class="banner"><span>✎ <b>你的 Agent codex-1 写了一份${draftTitle}</b>，还没发出，只有你能看到。</span><button class="primary" onclick="openDrawer()">查看并处理</button></div>`:''}</header><div class="flow">${flow}${scene==7?formalReply():''}</div>${bottom}`;
document.getElementById('app').innerHTML=app;let old=document.querySelector('.toast');if(old)old.remove();
if(V=='D'&&drawer&&hasDraft){document.body.insertAdjacentHTML('beforeend',draftD())}
if(fixed)document.body.insertAdjacentHTML('beforeend',fixed);
if(modal){let html=modal=='discard'?`<h3>丢弃这份草稿？</h3><p>丢弃即删除，不留档；工单上不会留下任何痕迹。</p><div class="modal ops"><button class="ghost" onclick="closeModal()">取消</button><button class="danger" onclick="closeModal()">丢弃</button></div>`:`<h3>草稿写成之后，工单有 2 条新变化</h3><div class="modal-list"><div>王工：补充：9/30 晚上的单子全部变成 9/29 了。 · 10:55</div><div>王工 上传了附件 0930.png · 10:56</div></div><p>草稿是 10:42 写的，可能没考虑到这些。</p><div class="modal ops"><button class="ghost" onclick="copyCommand();closeModal()">先不发，复制修改指令给 Agent</button><button class="ghost" onclick="closeModal()">回去看看</button><button class="primary" onclick="go7()">仍然发出</button></div></div>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal-mask"><div class="modal">${html}</div></div>`)}}
function setScene(n){scene=n;editing=false;showHistory=false;modal=null;if(n==4)modal='changes';if(V=='D')drawer=[3,4,5,6].includes(n);if(n==7)drawer=false;render();if(V=='A'&&n<=6)jumpDraft(true)}
function jumpDraft(noScroll){const el=document.querySelector('.draftcard,.draftpanel,.pending');if(el&&!noScroll)el.scrollIntoView({behavior:'smooth',block:'center'});if(V=='D')openDrawer()}
function startEdit(){if(V=='C'){scene=3;editing=true;if(V=='D')drawer=true;render()}else{scene=3;editing=true;if(V=='D')drawer=true;render()}}
function exitEdit(){scene=1;editing=false;if(V=='D')drawer=false;render()}
function copyCommand(){navigator.clipboard&&navigator.clipboard.writeText(command).catch(()=>{});let old=document.querySelector('.toast');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">✓ 已复制修改指令，粘贴给你的 Agent，再告诉它你想怎么改<pre>${esc(command)}</pre></div>`);clearTimeout(toastTimer);toastTimer=setTimeout(()=>{let t=document.querySelector('.toast');if(t)t.remove()},3500)}
function openModal(x){modal=x;render()}function closeModal(){modal=null;render()}
function sendDraft(){if(scene==4){modal='changes';render();return}go7()}function go7(){scene=7;modal=null;drawer=false;editing=false;render()}function openDrawer(){drawer=true;render()}function closeDrawer(){drawer=false;render()}function toggleHistory(){showHistory=!showHistory;render()}
render();
</script>
</body>
