<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · 行动优先</title>
<style>
body{margin:0;font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f6f3;color:#222}
#app{max-width:720px;margin:0 auto;padding-bottom:40px}
.top{padding:14px 16px 6px}
.top .meta{font-size:12px;color:#888}
.top h1{font-size:18px;margin:2px 0;line-height:1.4}
.action{margin:10px 12px;border-radius:14px;padding:14px 16px;background:#1f6f5c;color:#fff}
.action.done{background:#666}
.action .lbl{font-size:13px;opacity:.85}
.action .big{font-size:19px;font-weight:600;margin:2px 0 8px}
.action .quote{background:#ffffff1f;border-radius:8px;padding:8px 10px;font-size:14px}
.action .quote p{margin:3px 0}.action .quote ol{margin:3px 0;padding-left:20px}
.action code{background:#ffffff30;color:#fff}
.action .btns{display:flex;gap:8px;margin-top:10px}
.action button{flex:1;border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:600}
.b1{background:#fff;color:#1f6f5c}.b2{background:#ffffff26;color:#fff}
.tabs{display:flex;margin:14px 12px 0;border-bottom:1px solid #ddd}
.tabs div{padding:8px 14px;font-size:14px;color:#777}
.tabs div.on{color:#1f6f5c;border-bottom:2px solid #1f6f5c;font-weight:600}
.pane{margin:0 12px;background:#fff;border-radius:0 0 10px 10px;padding:6px 14px}
.it{padding:10px 0;border-bottom:1px solid #f0f0f0}
.it:last-child{border:0}
.it .who{font-size:12px;color:#888}.it .who b{color:#333}
.it p{margin:4px 0}.it ol{margin:4px 0;padding-left:20px}
.ev{font-size:12px;color:#999}
.f .q{font-size:13px;color:#888}.f .v{white-space:pre-wrap}.f .v.empty{color:#c60}
.sheet{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:50}
.sheet .in{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:16px 16px 0 0;padding:14px 16px 18px}
.sheet textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;padding:10px;font:inherit;height:120px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.row input{border:1px solid #ccc;border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;width:120px}
.sp{flex:1}
.btn{background:#1f6f5c;color:#fff;border:0;border-radius:10px;padding:9px 18px;font-size:15px}
.btn.ghost{background:#eef5f2;color:#1f6f5c}
.saved{font-size:12px;color:#1f6f5c}
/* 向导 */
.wiz{margin:12px;background:#fff;border-radius:14px;padding:16px}
.prog{height:6px;background:#eee;border-radius:3px;margin:6px 0 14px}.prog i{display:block;height:100%;background:#1f6f5c;border-radius:3px}
.wiz h2{font-size:20px;margin:4px 0}
.wiz .guide{color:#777;font-size:14px;margin-bottom:10px}
.wiz textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;padding:10px;font:inherit;height:110px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid #ccc;border-radius:18px;padding:7px 14px}
.chips span.on{background:#1f6f5c;color:#fff;border-color:#1f6f5c}
.err{color:#c33;font-size:14px;margin-top:8px}
.nav{display:flex;gap:8px;margin-top:16px}.nav button{flex:1}
.full{background:#fff;margin:40px 16px;border-radius:14px;padding:28px 20px;text-align:center}
.linkbox{background:#f3f5f3;border-radius:8px;padding:10px;word-break:break-all;font-size:13px;margin:10px 0}
.review .f{padding:6px 0;border-bottom:1px solid #f2f2f2}
.review .miss .q{color:#c33}
</style></head><body><div id="app"></div>
<script>// PROTOTYPE — 访客网页原型的共享假数据与状态切换，用完即弃
const T = {
  no: '20261015-007', seq: '#1234', kind: '反馈',
  title: 'BH-7600CS 质控时报警 E-203，无法开始测试',
  dept: '研发部', creatorMember: '李四',
  linkNote: '检验科-张三', expires: '11月14日',
  fields: [
    { key: 'model', q: '哪台仪器？', type: 'dim', req: true, val: 'BH-7600CS',
      guide: '在仪器背面铭牌上可以看到型号；不确定可以选“不确定”。',
      options: ['BH-7600CS', 'BH-7600', 'BH-5390', 'CA-800', '不确定'] },
    { key: 'ver', q: '序列号和软件版本是多少？', type: 'text', req: false, val: '',
      guide: '在“设置 → 关于本机”里可以看到。', ex: '序列号 7600CS-2023-0412，软件 V3.2.1' },
    { key: 'when', q: '什么时候发生的？', type: 'text', req: true, val: '10月15日上午 9:10 左右',
      guide: '大概时间即可。', ex: '今天上午 9 点左右' },
    { key: 'steps', q: '你做了哪些操作？', type: 'text', req: true,
      val: '1. 开机自检完成\n2. 进入质控界面\n3. 点击“开始”',
      guide: '按顺序写，一步一行。', ex: '1. 开机自检完成 2. 进入质控界面 3. 点击“开始”' },
    { key: 'actual', q: '实际看到了什么？', type: 'text', req: true,
      val: '屏幕弹出“E-203 试剂余量不足”，但试剂是早上刚换的新瓶。', img: 'E203报警.jpg',
      guide: '报警请把原文连同编号照抄，能拍照最好。', ex: '弹出“E-203 试剂余量不足”' },
    { key: 'expect', q: '你期望看到什么？', type: 'text', req: true, val: '正常开始质控测试。',
      guide: '本来应该发生什么。', ex: '正常开始质控测试' },
    { key: 'freq', q: '出现得频繁吗？', type: 'radio', req: true, val: '每次',
      options: ['每次', '经常', '偶尔', '仅一次'], guide: '' },
    { key: 'guess', q: '你的猜测（选填）', type: 'text', req: false, val: '',
      guide: '和上面的现象分开写，猜错也没关系。', ex: '可能是试剂瓶的液位传感器没识别到' },
  ],
  attachments: [
    { name: 'E203报警.jpg', size: '1.2 MB' },
    { name: '仪器日志.zip', size: '8.4 MB' },
  ],
  replies: [
    { who: 'guest', name: '张三', via: '检验科-张三', time: '10-15 09:32', event: '通过反馈入口提交了这张工单' },
    { who: 'agent', name: '李四 的 Agent · 初筛', time: '10-15 09:40',
      body: '感谢反馈，已转给仪器组。为了尽快定位，还需要两项信息：\n\n1. **软件版本**：在“设置 → 关于本机”里，例如 `V3.2.1`\n2. **试剂瓶照片**：报警时试剂瓶在仪器上的样子，拍清楚瓶身标签\n\n可以直接在下方回复，或者点“补全说明”填进对应的栏目。' },
  ],
};

const STATES = [
  ['read', '阅读与回复'],
  ['fill', '补全说明'],
  ['closed', '已关闭'],
  ['expired', '链接失效'],
  ['intake', '反馈入口'],
  ['intakeDone', '入口提交成功'],
];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
// 极简 Markdown：粗体、行内代码、编号列表、段落
function md(s) {
  return esc(s).split(/\n\n+/).map(p => {
    p = p.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
    if (/^\d+\. /.test(p)) return '<ol>' + p.split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('') + '</ol>';
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
function img(name) { return `<div class="imgph">🖼 ${esc(name)}</div>`; }

function toast(msg, ms = 2600) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'show';
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', ms);
}
// 演示：模拟提交时服务正在更新
function fakeSend() {
  toast('服务更新中，内容已保存在本机，正在自动重试…', 1800);
  setTimeout(() => toast('✓ 已发送'), 2000);
}
function fakeBigFile(el) {
  el.innerHTML = `<div class="toobig">⚠ <b>录像.mp4（186 MB）</b>超过单个文件 50 MB 的上限，没有上传。<br>请把文件放到 NAS 共享盘，再把路径粘贴到文字里，例如 <code>\\\\nas01\\检验科\\录像.mp4</code></div>`;
}

function mountSwitcher(render) {
  const bar = document.createElement('div');
  bar.id = 'protobar';
  bar.innerHTML = '<span>原型状态：</span>' + STATES.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join('');
  document.body.prepend(bar);
  const go = k => {
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    document.getElementById('app').innerHTML = render(k);
    window.scrollTo(0, 0);
  };
  bar.addEventListener('click', e => e.target.dataset.k && go(e.target.dataset.k));
  go('read');
}

const PROTO_CSS = `
#protobar{position:sticky;top:0;z-index:99;background:#222;color:#bbb;font:12px sans-serif;padding:6px 8px;display:flex;gap:4px;overflow-x:auto;white-space:nowrap}
#protobar button{background:#444;color:#eee;border:0;border-radius:10px;padding:3px 9px;font-size:12px}
#protobar button.on{background:#f5b301;color:#000}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:100;max-width:90%}
#toast.show{opacity:1}
.imgph{background:repeating-linear-gradient(45deg,#e8e8e8,#e8e8e8 8px,#f2f2f2 8px,#f2f2f2 16px);border-radius:6px;height:110px;display:flex;align-items:center;justify-content:center;color:#777;font-size:13px;margin:6px 0}
.toobig{background:#fff4e5;border:1px solid #f0b060;border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.6;margin-top:6px}
code{background:#f0f0f0;padding:1px 4px;border-radius:3px;font-size:.92em}
`;
document.head.insertAdjacentHTML('beforeend', `<style>${PROTO_CSS}</style>`);
</script>
<script>
let tab = 'thread';
function topBar() { return `<div class="top"><div class="meta">${T.dept} · ${T.kind} · ${T.no} · 链接 ${T.expires}到期</div><h1>${esc(T.title)}</h1></div>`; }
function action(closed) {
  if (closed) return `<div class="action done"><div class="lbl">状态</div><div class="big">已关闭 · 完成</div><div class="quote"><p>李四：已确认是液位传感器固件问题，V3.2.2 已修复，明天上门升级。</p></div><div class="lbl" style="margin-top:8px">工单关闭后只能查看。如还有问题，请联系 ${T.dept} ${T.creatorMember}。</div></div>`;
  const last = T.replies[T.replies.length - 1];
  return `<div class="action"><div class="lbl">需要你做的事</div><div class="big">研发部在等你补充信息</div>
  <div class="quote"><div style="font-size:12px;opacity:.8">${last.name} · ${last.time}</div>${md(last.body)}</div>
  <div class="btns"><button class="b1" onclick="openSheet()">回复</button><button class="b2" onclick="go('fill')">补全说明</button></div></div>`;
}
function tabs() {
  const t = [['thread', `往来 ${T.replies.length}`], ['brief', '说明'], ['att', `附件 ${T.attachments.length}`]];
  return `<div class="tabs">${t.map(([k, n]) => `<div class="${k === tab ? 'on' : ''}" onclick="tab='${k}';rerender()">${n}</div>`).join('')}</div><div class="pane">${pane()}</div>`;
}
function pane() {
  if (tab === 'thread') return T.replies.map(r => r.event ? `<div class="it ev">${r.time} · ${r.name}（${r.via}）${r.event}</div>`
    : `<div class="it"><div class="who"><b>${r.name}</b> · ${r.time}</div>${md(r.body)}</div>`).join('');
  if (tab === 'brief') return T.fields.map(f => `<div class="it f"><div class="q">${f.q}</div><div class="v ${f.val ? '' : 'empty'}">${f.val ? esc(f.val) : '还没填 · 点上方“补全说明”'}</div>${f.img ? img(f.img) : ''}</div>`).join('');
  return T.attachments.map(a => `<div class="it">📎 ${a.name} <span class="ev">${a.size}</span></div>`).join('');
}
function openSheet() {
  document.body.insertAdjacentHTML('beforeend', `<div class="sheet" onclick="if(event.target===this)this.remove()"><div class="in">
  <b>回复研发部</b><textarea placeholder="直接写就行，可以粘贴截图"></textarea><div id="up"></div>
  <div class="row"><button class="btn ghost" onclick="fakeBigFile(document.getElementById('up'))">📎 加文件</button><span class="saved">已自动保存</span><span class="sp"></span></div>
  <div class="row">署名 <input value="检验科 张三"><span class="sp"></span><button class="btn" onclick="fakeSend()">发送</button></div></div></div>`);
}
const steps = [{ q: '一句话标题', type: 'text', req: true, guide: '哪台仪器、哪个功能、什么现象。', ex: 'BH-7600CS 质控时报警 E-203' }, ...T.fields, { q: '你的署名', type: 'text', req: true, guide: '方便研发部联系你。', ex: '检验科 张三' }];
let step = 0;
function wizard() {
  const f = steps[step], n = steps.length;
  let input;
  if (f.type === 'dim' || f.type === 'radio') input = `<div class="chips">${f.options.map(o => `<span onclick="this.parentNode.querySelectorAll('span').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${o}</span>`).join('')}</div>`;
  else input = `<textarea placeholder="示例：${esc(f.ex || '')}"></textarea><div class="saved" style="margin-top:4px">🖼 可以粘贴或拍照上传</div>`;
  return `<div class="top"><div class="meta">${T.dept} · 仪器问题反馈</div></div><div class="wiz"><div class="meta" style="font-size:12px;color:#888">第 ${step + 1} / ${n} 项 ${f.req ? '· 必填' : '· 选填，可跳过'}</div>
  <div class="prog"><i style="width:${(step + 1) / n * 100}%"></i></div><h2>${f.q}</h2><div class="guide">${f.guide || ''}</div>${input}
  ${step === 4 ? '<div class="err">这一项必填，请按顺序写下你的操作。</div>' : ''}
  <div class="nav"><button class="btn ghost" onclick="step=Math.max(0,step-1);rerender()">上一项</button><button class="btn" onclick="step<${n - 1}?(step++,rerender()):go('intakeReview')">下一项</button></div></div>
  <p class="saved" style="text-align:center">每一项都自动保存在本机，关掉页面也不会丢</p>`;
}
function review() {
  return `<div class="top"><div class="meta">${T.dept} · 仪器问题反馈 · 最后确认</div><h1>检查一下再提交</h1></div><div class="wiz review">
  ${steps.map((f, i) => `<div class="f ${i === 4 || i === 7 ? 'miss' : ''}"><div class="q">${f.q}${i === 4 || i === 7 ? ' · 必填，还没填' : ''}</div><div class="v">${i === 4 || i === 7 ? '<a href="#" onclick="step=' + i + ';go(\'intake\');return false">去填写 ›</a>' : esc(f.val || (f.req ? '（已填）' : '—'))}</div></div>`).join('')}
  <div class="nav"><button class="btn" onclick="fakeSend()">提交反馈</button></div></div>`;
}
let cur = 'read';
function render(s) {
  cur = s;
  if (s === 'read') return topBar() + action(false) + tabs();
  if (s === 'closed') return topBar() + action(true) + tabs();
  if (s === 'fill') return topBar() + `<div class="wiz"><b>补全说明</b><div class="guide">只显示还没填的项，填完点保存；已填的项在下方可以修改。</div>
    ${T.fields.filter(f => !f.val).map(f => `<div style="margin:10px 0"><div style="font-weight:600">${f.q}</div><div class="guide">${f.guide}</div><textarea placeholder="示例：${esc(f.ex || '')}"></textarea></div>`).join('')}
    <details><summary style="color:#1f6f5c">修改已填的 ${T.fields.filter(f => f.val).length} 项</summary>${T.fields.filter(f => f.val).map(f => `<div style="margin:8px 0"><div style="font-weight:600">${f.q}</div><textarea>${esc(f.val)}</textarea></div>`).join('')}</details>
    <div class="nav"><button class="btn ghost" onclick="go('read')">返回</button><button class="btn" onclick="fakeSend()">保存</button></div></div>`;
  if (s === 'expired') return `<div class="full"><div style="font-size:42px">⏳</div><h2>这条链接已失效</h2><p style="color:#666">链接已于 11月14日 到期（或已被撤销）。<br>需要继续跟进，请联系 ${T.dept} ${T.creatorMember} 重新发一条链接。</p></div>`;
  if (s === 'intake') return wizard();
  if (s === 'intakeReview') return review();
  if (s === 'intakeDone') return `<div class="full"><div style="font-size:42px">✅</div><h2>已提交，编号 ${T.no}</h2><p>请<b>收藏这条专属链接</b>，之后在这里看回复、补信息：</p><div class="linkbox">https://taskboard.lan/g/kX9f2Qa7Lm…</div><button class="btn">复制链接</button></div>`;
}
let go, rerender = () => go(cur);
mountSwitcher(render);
go = k => { document.getElementById('app').innerHTML = render(k); window.scrollTo(0, 0); };
</script></body></html>
