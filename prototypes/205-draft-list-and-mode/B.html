<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>候选 B · 草稿就在工单列表里</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#222;font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.scenebar{position:sticky;top:0;z-index:1000;background:#1f2937;color:#fff;padding:8px 14px}.scenebar-top{display:flex;justify-content:space-between;font-size:13px;color:#dbe2ea}.scenes{display:flex;gap:6px;overflow:auto;padding:7px 0}.scene{background:#374151;color:#d1d5db;border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}.scene.on{background:#e0a100;color:#262100;font-weight:700}
.desk{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 51px)}.side{background:#fff;border-right:1px solid #e2e6ee;padding:16px}.brand{font-weight:900;color:#243b57;margin:0 8px 12px}.nav{display:block;width:100%;text-align:left;padding:8px;border-radius:7px;color:#526274;background:none}.nav.on{background:#e9f1ff;color:#245ba8;font-weight:700}.main{padding:16px}.mobilehead{display:none}.tabs{display:flex;gap:7px;margin:12px 0}.tab{background:#fff;border:1px solid #dde3ea;border-radius:999px;padding:4px 10px;font-size:13px}.tab.on{background:#2a6fdb;color:#fff}.card{background:#fff;border:1px solid #e3e7ef;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0000000a}.muted{color:#73808c;font-size:13px}.draftrow{display:block;width:100%;text-align:left;margin-top:8px;padding:11px;border:2px dashed #e0a100;background:repeating-linear-gradient(-45deg,#fffaf0 0 10px,#fff6e0 10px 20px);border-radius:8px}.draftrow .title{font-weight:700}.type{background:#e0a100;color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;margin-right:6px}.warn{background:#fdeeee;color:#953131;border-radius:5px;padding:1px 6px;font-size:12px}.normalrow{display:block;width:100%;text-align:left;background:none;border-bottom:1px solid #edf0f5;padding:10px 4px}
.split{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:14px;margin-top:12px;align-items:start}.detailwrap{position:relative;overflow:hidden}.watermark{position:absolute;right:14px;top:25px;transform:rotate(12deg);font-size:24px;font-weight:900;color:#e0a10059;z-index:2}.detailwrap h2{margin:0;font-size:19px}.meta{display:flex;flex-wrap:wrap;gap:6px;color:#67737f;font-size:13px;margin-top:8px}.chip{background:#fffaf0;border-bottom:2px dashed #e0a100;color:#7a5200;border-radius:5px;padding:1px 6px;font-size:13px}.field{margin-top:11px}.q{font-size:12px;color:#77828e}.ops{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed #d8ab34}.primary{background:#2a6fdb;color:#fff;border-radius:8px;padding:5px 11px}.ghost{background:#eef3fc;color:#2a6fdb;border-radius:8px;padding:5px 11px}.danger{color:#d64545;border:1px solid #dfa4a4;background:#fff;border-radius:8px;padding:5px 11px}.history{background:#f5f7f9;border-radius:8px;padding:9px;margin-top:8px;font-size:13px;color:#55606c}.who{font-size:13px;color:#7a5200;margin:8px 0}.who b{color:#9a5b00}
.agentrow{border-bottom:1px solid #edf0f5;padding:10px 0}.agenthead{display:flex;gap:10px;align-items:center;justify-content:space-between;background:none;width:100%;text-align:left}.pill{background:#e0a100;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}.pill.direct{background:#64748b}.accordion{margin-top:9px;background:#fffaf0;border:1px dashed #d8ab34;border-radius:8px;padding:10px;color:#7a5200}.seg{display:flex;border:1px solid #d8ab34;border-radius:8px;overflow:hidden}.seg button{background:#fff;color:#7a5200;padding:5px 9px}.seg button.on{background:#e0a100;color:#fff}
.banner{margin:0 0 12px;background:repeating-linear-gradient(-45deg,#fffaf0 0 10px,#fff6e0 10px 20px);border:1px solid #e0a100;color:#7a5200;padding:9px;border-radius:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}.bellwrap{position:relative}.bell{position:relative;background:none;font-size:18px}.bell::after{content:"2";position:absolute;right:-7px;top:-6px;background:#d64545;color:#fff;border-radius:999px;font-size:10px;padding:0 4px}.bellpanel{position:absolute;right:0;top:35px;width:320px;background:#fff;border:1px solid #dfe4ec;border-radius:9px;box-shadow:0 18px 45px #0002;padding:7px;z-index:110}.note{display:block;width:100%;text-align:left;padding:9px;background:none}.note.agent{background:#fffaf0}.note small{display:block;color:#76828e}
.modalmask{position:fixed;inset:0;background:#11182766;display:flex;align-items:center;justify-content:center;padding:16px;z-index:150}.modal{width:min(500px,100%);background:#fff;border-radius:10px;padding:17px}.modal h3{margin:0 0 7px}.segbig{display:flex;border:1px solid #d8ab34;border-radius:8px;overflow:hidden;margin-top:10px}.segbig button{flex:1;background:#fff;color:#7a5200;padding:7px}.segbig button.on{background:#e0a100;color:#fff}.modalops{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;left:16px;right:16px;bottom:20px;margin:auto;max-width:600px;background:#1f2937;color:#fff;border-radius:9px;padding:11px;z-index:180}.toast pre{white-space:pre-wrap;font:11px/1.5 Consolas,monospace;color:#cbd5e1}
@media(max-width:899px){.desk{grid-template-columns:1fr}.side{display:none}.mobilehead{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #e2e6ee;position:sticky;top:51px;z-index:100}.split{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe4ec}.bottom button{background:none;padding:7px;color:#687585;font-size:11px}}@media(min-width:900px){.bottom{display:none}}
</style></head><body><div class="scenebar"><div class="scenebar-top"><b>候选 B · 草稿就在工单列表里</b><span>张敏 · 成员</span></div><div class="scenes" id="scenes"></div></div><div class="mobilehead"><b>工单板</b><div class="bellwrap"><button class="bell" onclick="bell=!bell;render()">🔔</button></div></div><div class="desk"><aside class="side"><h1 class="brand">工单板</h1><button class="primary" style="border-radius:8px;padding:8px">＋ 建单</button><button class="nav">📥 收件箱</button><button class="nav on">🗂 工单</button><button class="nav">🧰 工具</button><button class="nav" onclick="setScene(5)">👤 我的</button></aside><main class="main" id="app"></main></div><div class="bottom"><button>收件箱</button><button>工单</button><button>＋</button><button>工具</button><button onclick="setScene(5)">我的</button></div><script>
const scenes=['通知','我的草稿','建单草稿预览','发出前改标签/指派','Agent 设置','签发新 token','上线提示'];let scene=3,expanded='',modal=null,modalKey='',bell=false,editing=false,history=false,modes={'codex-1':'draft','cli-本机':'direct'};const command='请修改建单草稿「报销系统导出 Excel 时金额列变成科学计数法」（第 2 版）：补充金额列格式应保留 Excel 数值格式，不要科学计数法；保留附件导出样例.xlsx。修改后保存为第 3 版。';const drafts=[['建单草稿','报销系统导出 Excel 时金额列变成科学计数法','codex-1 · 第 2 版 · 10-21 15:40'],['建单草稿','Q4 采购审批流程梳理','codex-1 · 第 1 版 · 10-20 18:02'],['回复草稿','#128 供应商对账单导入失败','codex-1 · 第 3 版 · 10-21 14:05 · 工单有 2 条新变化'],['说明修订草稿','#117 门禁卡权限申请','codex-1 · 第 1 版 · 10-19 11:30']];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function openDraft(i){if(i==0)setScene(3);else if(i==2)toast('跳到工单 #128 详情里的草稿处');else if(i==3)toast('跳到工单 #117 详情里的草稿处')}function draftList(){return drafts.map((d,i)=>`<button class="draftrow" onclick="openDraft(${i})"><span class="type">${d[0]}</span><span class="title">${d[1]}</span><div class="muted">${d[2]}</div></button>`).join('')}
function detail(){return `<div class="card detailwrap"><div class="watermark">草稿·未发布</div><div class="meta"><span>编号在发出时分配</span><span>模板：缺陷反馈</span></div><h2>报销系统导出 Excel 时金额列变成科学计数法</h2><div class="meta">${editing?['标签|系统:报销；优先级:中','指派|李工','访客链接|财务部 王芳 / 14 天'].map(x=>{let[a,b]=x.split('|');return `<label style="width:100%;color:#7a5200">${a}<input style="width:100%;border:1px solid #d8ab34;background:#fffaf0;color:#7a5200;border-radius:6px;padding:5px" value="${b}"></label>`}).join(''):'<button class="chip" onclick="editing=true;render()">标签：系统:报销 · 优先级:中 ✎</button><button class="chip" onclick="editing=true;render()">指派：李工 ✎</button><button class="chip" onclick="editing=true;render()">访客链接：财务部 王芳 · 14 天 ✎</button>'}<span style="width:100%;color:#9a5b00;font-size:12px">以上三项在发出时才生效</span></div><div class="who"><b>codex-1（你的 Agent）</b>写的建单草稿 · 第 2 版 · 10-21 15:40 <button style="color:#2a6fdb;background:none" onclick="history=!history;render()">${history?'收起':'查看起草过程（2 版）'}</button>${history?'<div class="history"><div>第 1 版 · codex-1 写 · 10-21 15:10</div><div>第 2 版 · codex-1 修改 · 10-21 15:40</div></div>':''}</div>${editing?'':`<div class="field"><div class="q">系统</div>报销系统</div><div class="field"><div class="q">现象</div>导出后金额列显示为 1.23E+05</div><div class="field"><div class="q">复现步骤</div>1. 导出 10 月报销明细<br>2. 打开 xlsx<br>3. 查看金额列</div><div class="field"><div class="q">期望</div>保持原数字格式</div><div class="field"><div class="q">附件</div>📎 导出样例.xlsx</div>`}<div class="ops">${editing?'<button class="ghost" onclick="editing=false;render()">完成</button>':'<button class="danger" onclick="modal=&apos;discard&apos;;render()">丢弃</button><button class="ghost" onclick="copyCommand()">复制修改指令</button><button class="ghost" onclick="editing=true;render()">直接修改</button><button class="primary" onclick="modal=&apos;send&apos;;render()">发出</button>'}</div></div>`}
function agentCard(){return `<div class="card"><h2>Agent</h2><p class="muted">签发具名 token 后，你的 Agent 可以代你建单、回复、交付和修订说明。</p>${[['codex-1','09-02'],['cli-本机','08-15']].map(([k,d])=>`<div class="agentrow"><button class="agenthead" onclick="expanded=expanded=='${k}'?'':'${k}';render()"><span><b>${k}</b><br><small class="muted">创建于 ${d}</small></span><span class="pill ${modes[k]=='direct'?'direct':''}">${modes[k]=='draft'?'必须走草稿':'可直接发'}</span></button>${expanded==k?`<div class="accordion"><div class="seg"><button class="${modes[k]=='draft'?'on':''}" onclick="modes['${k}']='draft';render()">必须走草稿</button><button class="${modes[k]=='direct'?'on':''}" onclick="switchMode('${k}')">可直接发</button></div><p>必须走草稿：建单、回复、交付、修订说明都会先存成草稿，你看过再发出。<br>可直接发：内容立刻对外可见，署名不注明「经你确认」。<br>打标签、指派、加协作者、关闭或重开都直接生效。</p></div>`:''}</div>`).join('')}<div class="agentrow muted">old-bot · 已停用</div><button class="primary" onclick="setScene(6)">＋ 生成新 token</button></div>`}
function render(){document.getElementById('scenes').innerHTML=scenes.map((s,i)=>`<button class="scene ${scene==i+1?'on':''}" onclick="setScene(${i+1})">${i+1}.${s}</button>`).join('');let x='';if(scene==7)x='<div class="banner"><span><b>工单板已更新：</b>你的 Agent 现在写的内容会先存成草稿，你确认后才发出。codex-1、cli-本机 已改为必须走草稿；需要的话可以在「我的 → Agent」里改回可直接发。</span><span><button class="ghost" onclick="setScene(5)">去设置</button> <button class="primary" onclick="setScene(1)">知道了</button></span></div>';
if(scene==1)x+=`<div class="bellwrap"><button class="bell" onclick="bell=!bell;render()">🔔</button>${bell?'<div class="bellpanel"><button class="note agent"><b>你的 Agent 写了草稿待确认</b><small>codex-1 · 报销系统导出… · 15:40</small></button><button class="note" onclick="setScene(3)"><b>王工 补充了工单 #128</b></button><button class="note"><b>系统维护提醒</b></button></div>':''}</div><div class="card"><h1>通知</h1></div>`;
if(scene==2)x+='<h1>工单</h1><div class="tabs"><button class="tab">全部</button><button class="tab on">我的草稿 4</button></div><div class="card">'+draftList()+'</div>';
if([3,4].includes(scene))x+='<h1>工单</h1><div class="split"><div><div class="tabs"><button class="tab">全部</button><button class="tab on">我的草稿 4</button></div><div class="card">'+draftList()+'</div></div><div>'+detail()+'</div></div>';
if(scene==5)x+='<h1>我的</h1><div class="card" onclick="setScene(2)" style="cursor:pointer">✎ 我的草稿（4）</div>'+agentCard();
if(scene==6)x+='<div class="modalmask"><div class="modal"><h3>生成新 token</h3><label>名字<input style="width:100%;border:1px solid #dce2ea;border-radius:7px;padding:6px" value="codex-2"></label><div class="segbig"><button class="on">必须走草稿</button><button onclick="toast(&apos;已选择可直接发&apos;)">可直接发</button></div><p class="muted">推荐：这个 Agent 建单、回复、交付、修订说明，都会先存成草稿，你在网页上看过再发出。可直接发则立刻对外可见。打标签、指派、加协作者、关闭或重开都直接生效。</p><div class="modalops"><button class="ghost" onclick="setScene(5)">取消</button><button class="primary" onclick="toast(&apos;已生成 token：必须走草稿&apos;)">生成</button></div></div></div><div class="card"><h1>我的</h1></div>';
if(scene==7)x+='<div class="card"><h1>工单</h1></div>';document.getElementById('app').innerHTML=x;document.querySelectorAll('[data-modal],.toast').forEach(n=>n.remove());if(modal)document.body.insertAdjacentHTML('beforeend',`<div class="modalmask" data-modal><div class="modal">${modal=='discard'?'<h3>丢弃建单草稿？</h3><p>丢弃即删除，不留档。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="danger" onclick="modal=null;setScene(2)">确认丢弃</button></div>':modal=='mode'?`<h3>改为可直接发？</h3><p>它写的内容将立刻对外可见，署名里不注明「经你确认」。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="primary" onclick="modes[modalKey]='direct';modal=null;render();toast('已切换为可直接发')">确认</button></div>`:'<h3>发出建单草稿？</h3><p>标签：系统:报销 · 优先级:中<br>指派：李工<br>访客链接：财务部 王芳 · 14 天</p><p>发出后署名「张敏 的 Agent · codex-1 · 经张敏确认」。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="primary" onclick="modal=null;sendDone()">确认发出</button></div>'}</div></div>`)}
function setScene(n){scene=n;modal=null;editing=n==4;history=false;bell=n==1;render()}function switchMode(k){if(modes[k]=='draft'){modal='mode';modalKey=k;render()}else{modes[k]='direct';render()}}function toast(t,p){let old=document.querySelector('.toast');old&&old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">${t}${p?'<pre>'+esc(p)+'</pre>':''}</div>`);setTimeout(()=>{let x=document.querySelector('.toast');x&&x.remove()},3600)}function copyCommand(){try{navigator.clipboard.writeText(command)}catch(_){}toast('✓ 已复制修改指令',command)}function sendDone(){toast('已发出：张敏 的 Agent · codex-1 · 经张敏确认');setScene(2)}render();
</script></body></html>
