<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>候选 A · 侧栏入口 + 独立页</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{background:#eef1f6;color:#222;font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:#2a6fdb}
.scenebar{position:sticky;top:0;z-index:1000;background:#1f2937;color:#fff;padding:8px 14px 10px}.scenebar-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#dbe2ea}.scenebar-top b{color:#fff}.scenes{display:flex;gap:6px;overflow:auto;padding-top:7px;scrollbar-width:none}.scenes::-webkit-scrollbar{display:none}.scene{white-space:nowrap;background:#374151;color:#d1d5db;border-radius:999px;padding:4px 10px;font-size:12px}.scene.on{background:#e0a100;color:#262100;font-weight:700}
.shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 51px)}.side{background:#fff;border-right:1px solid #e2e6ee;padding:18px 14px;display:flex;flex-direction:column;gap:4px}.brand{font-weight:900;color:#243b57;margin:0 8px 12px;font-size:18px}.nav{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;color:#526274;text-align:left}.nav:hover{background:#f3f6fa}.nav.on{background:#e9f1ff;color:#245ba8;font-weight:700}.newbtn{background:#2a6fdb;color:#fff;border-radius:8px;padding:8px;margin:4px 0 12px}.draftcount{margin-left:auto;background:#e0a100;color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:700}.main{padding:18px;max-width:1100px;width:100%;margin:auto}.bottom{display:none}.mobilehead{display:none}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.pagehead h1{font-size:21px;margin:0}.pagehead p{margin:2px 0 0;color:#687585;font-size:13px}
.card{background:#fff;border:1px solid #e3e7ef;border-radius:10px;box-shadow:0 1px 3px #0000000a;padding:14px 16px}.group h2{font-size:14px;color:#4a586a;margin:16px 0 8px}.row{display:flex;gap:10px;align-items:center;padding:11px 10px 11px 12px;border-left:4px solid #e0a100;border-radius:6px;margin-top:8px;background:#fff;text-align:left}.row:hover{background:#fffaf0}.rtitle{font-weight:700;font-size:15px}.rmeta{color:#6b7787;font-size:12px;margin-top:2px}.type{display:inline-block;background:#e0a100;color:#fff;border-radius:4px;font-size:11px;font-weight:700;padding:1px 6px;margin-right:6px}.newchanges{display:block;background:#fdeeee;color:#953131;border-radius:5px;padding:1px 7px;font-size:12px;margin-top:5px;width:fit-content}
.draftbanner{border:2px dashed #e0a100;background:repeating-linear-gradient(-45deg,#fffaf0 0 10px,#fff6e0 10px 20px);color:#9a5b00;padding:9px 14px;border-radius:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.who{font-size:13px;color:#7a5200;margin:9px 0}.who b{color:#9a5b00}.linkbtn{color:#2a6fdb;background:none;padding:0;font-size:12px}.detailgrid{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-top:12px;align-items:start}.detail h2{font-size:19px;margin:0}.meta{display:flex;flex-wrap:wrap;gap:7px;color:#66737f;font-size:13px;margin-top:7px}.badge{background:#eef2f8;border-radius:999px;padding:2px 8px;font-size:12px}.field{margin-top:11px}.field .q{color:#77828e;font-size:12px}.field .a{margin-top:2px}.chip{background:#f2f5f9;border:1px solid #dde3ea;border-radius:7px;padding:3px 8px;font-size:13px}.sidepanel h3{font-size:14px;margin:0 0 6px;color:#9a5b00}.effect{border:1px dashed #d8ab34;background:#fffaf0;border-radius:8px;padding:8px;margin-top:8px;color:#7a5200;font-size:13px}.effect b{color:#9a5b00}.effect button{color:#2a6fdb;background:none;padding:0;font-size:12px}.effect input,.effect select{width:100%;margin-top:5px;border:1px solid #d8ab34;background:#fff;border-radius:6px;padding:4px 6px;color:#9a5b00}
.history{background:#f5f7f9;border-radius:8px;padding:9px;margin-top:8px;font-size:13px;color:#55606c}.history div{padding:3px 0}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe4ec;padding:9px 16px;display:flex;justify-content:center;z-index:60}.actioninner{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;width:100%;max-width:1050px}.primary{background:#2a6fdb;color:#fff;border-radius:8px;padding:5px 11px}.ghost{background:#eef3fc;color:#2a6fdb;border-radius:8px;padding:5px 11px}.danger{background:#fff;color:#d64545;border:1px solid #dfa4a4;border-radius:8px;padding:5px 11px}
.table{width:100%;border-collapse:collapse;font-size:14px}.table th{text-align:left;color:#74808c;font-size:12px;border-bottom:1px solid #e3e7ef;padding:6px}.table td{border-bottom:1px solid #edf0f5;padding:10px 6px}.badge-use{background:#e8f7ef;color:#237a4e;border-radius:999px;padding:1px 7px;font-size:12px}.badge-off{background:#eee;color:#777;border-radius:999px;padding:1px 7px;font-size:12px}.switch{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:#7a5200;font-size:13px}.dot{width:34px;height:19px;background:#e0a100;border-radius:999px;position:relative}.dot.off{background:#c8d1dc}.dot::after{content:"";position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;top:2px;left:16px}.dot.off::after{left:2px}.muted{color:#7a8794;font-size:13px}.radio{border:1px solid #dce2ea;border-radius:9px;padding:10px;text-align:left;display:block;background:#fff}.radio.on{border-color:#e0a100;background:#fffaf0}.radio b{color:#9a5b00}.radio small{display:block;color:#6d7885}
.bellwrap{position:relative}.bell{position:relative;background:none;font-size:18px}.bell::after{content:"2";position:absolute;right:-6px;top:-5px;background:#d64545;color:#fff;border-radius:999px;font-size:10px;padding:0 4px}.bellpanel{position:absolute;right:0;top:35px;width:330px;background:#fff;border:1px solid #dfe4ec;border-radius:10px;box-shadow:0 16px 40px #0002;padding:8px;z-index:80}.note{display:block;width:100%;text-align:left;border-radius:7px;padding:9px}.note:hover{background:#f4f7fb}.note.agent{background:#fffaf0}.note small{display:block;color:#76828e}
.modalmask{position:fixed;inset:0;background:#11182766;display:flex;align-items:center;justify-content:center;padding:16px;z-index:120}.modal{width:min(500px,100%);background:#fff;border-radius:10px;padding:17px;box-shadow:0 20px 60px #0004}.modal h3{margin:0 0 7px}.modal p{color:#66737f}.modalops{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}.toast{position:fixed;left:16px;right:16px;bottom:72px;z-index:130;margin:auto;max-width:600px;background:#1f2937;color:#fff;border-radius:10px;padding:11px 13px;box-shadow:0 10px 30px #0003}.toast pre{white-space:pre-wrap;font:11px/1.5 Consolas,monospace;color:#cbd5e1;margin:6px 0 0}
@media(max-width:899px){.shell{grid-template-columns:1fr}.side{display:none}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe4ec;z-index:60}.bottom button{background:none;padding:7px 2px;color:#687585;font-size:11px;position:relative}.bottom button.on{color:#245ba8;font-weight:700}.mobilehead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fff;border-bottom:1px solid #e2e6ee;position:sticky;top:51px;z-index:70}.brandm{font-weight:900;color:#243b57}.reddot{width:8px;height:8px;background:#e0a100;border-radius:50%;display:inline-block;margin-left:4px}.main{padding:12px 12px 110px}.detailgrid{grid-template-columns:1fr}.actioninner{justify-content:center}}
</style></head><body>
<div class="scenebar"><div class="scenebar-top"><b>候选 A · 侧栏入口 + 独立页</b><span>张敏 · 成员</span></div><div class="scenes" id="scenes"></div></div>
<div class="mobilehead"><div class="brandm">工单板</div><div style="display:flex;gap:12px;align-items:center"><button class="bell" onclick="setScene(1)">🔔</button><button onclick="setScene(5)">👤<span class="reddot"></span></button></div></div>
<div class="shell"><aside class="side"><h1 class="brand">工单板</h1><button class="newbtn">＋ 建单</button><button class="nav">📥 收件箱</button><button class="nav draftnav on">✎ 草稿 <span class="draftcount">4</span></button><button class="nav">🗂 工单</button><button class="nav">🧰 工具</button><button class="nav" onclick="setScene(5)">👤 我的</button></aside><main class="main" id="app"></main></div>
<div class="bottom"><button>收件箱</button><button>工单</button><button>＋</button><button>工具</button><button onclick="setScene(5)">我的<span class="reddot"></span></button></div>
<script>
const scenes=['通知','我的草稿','建单草稿预览','发出前改标签/指派','Agent 设置','签发新 token','上线提示'];
let scene=3,editing=false,showHistory=false,modal=null,modalKey='',toastTimer=null,bell=false,modes={'codex-1':'draft','cli-本机':'direct','old-bot':'draft'};
const command='请修改建单草稿「报销系统导出 Excel 时金额列变成科学计数法」（第 2 版）：补充金额列格式应保留 Excel 数值格式，不要科学计数法；保留附件导出样例.xlsx。修改后保存为第 3 版。';
const drafts=[
 {type:'建单草稿',title:'报销系统导出 Excel 时金额列变成科学计数法',meta:'codex-1 · 第 2 版 · 10-21 15:40',scene:3},
 {type:'建单草稿',title:'Q4 采购审批流程梳理',meta:'codex-1 · 第 1 版 · 10-20 18:02',scene:3},
 {type:'回复草稿',title:'#128 供应商对账单导入失败',meta:'codex-1 · 第 3 版 · 10-21 14:05',warn:'工单有 2 条新变化',jump:'#128'},
 {type:'说明修订草稿',title:'#117 门禁卡权限申请',meta:'codex-1 · 第 1 版 · 10-19 11:30',jump:'#117'}];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function detail(){return `<div class="card detail"><div class="meta"><span class="badge">编号在发出时分配</span><span class="badge">模板：缺陷反馈</span></div><h2>报销系统导出 Excel 时金额列变成科学计数法</h2><div class="who"><b>codex-1（你的 Agent）</b>写的建单草稿 · 第 2 版 · 10-21 15:40 <button class="linkbtn" onclick="showHistory=!showHistory;render()">${showHistory?'收起':'查看起草过程（2 版）'}</button>${showHistory?`<div class="history"><div>第 1 版 · codex-1 写 · 10-21 15:10</div><div>第 2 版 · codex-1 修改 · 10-21 15:40</div></div>`:''}</div>${editing?`<textarea style="width:100%;min-height:150px;border:1px solid #d8ab34;background:#fffaf0;color:#7a5200;border-radius:8px;padding:8px">系统：报销系统\n现象：导出后金额列显示为 1.23E+05\n复现步骤：1. 导出 10 月报销明细 2. 打开 xlsx 3. 查看金额列\n期望：保持原数字格式</textarea>`:`<div class="field"><div class="q">系统</div><div class="a">报销系统</div></div><div class="field"><div class="q">现象</div><div class="a">导出后金额列显示为 1.23E+05</div></div><div class="field"><div class="q">复现步骤</div><div class="a">1. 导出 10 月报销明细<br>2. 打开 xlsx<br>3. 查看金额列</div></div><div class="field"><div class="q">期望</div><div class="a">保持原数字格式</div></div><div class="field"><div class="q">附件</div><div class="a"><span class="chip">📎 导出样例.xlsx</span></div></div>`}</div>`}
function effects(){return `<div class="card sidepanel"><h3>发出时会做的事</h3><p class="muted">以下三项现在只保存在草稿里，点「发出」时才生效。</p><div class="effect"><b>标签</b> <button onclick="toast('已进入标签编辑')">${editing?'收起':'编辑'}</button><br>${editing?'<input value="系统:报销；优先级:中">':'系统:报销 · 优先级:中'}</div><div class="effect"><b>指派</b> <button onclick="toast('已进入指派编辑')">${editing?'收起':'编辑'}</button><br>${editing?'<select><option>李工</option><option>赵工</option></select>':'李工'}</div><div class="effect"><b>访客链接</b> <button onclick="toast('已进入访客链接编辑')">${editing?'收起':'编辑'}</button><br>财务部 王芳 · 有效期 14 天${editing?'<select><option>14 天</option><option>7 天</option></select>':''}</div></div>`}
function agentTable(){return `<div class="card"><h2 style="margin:0 0 8px;font-size:16px">Agent</h2><p class="muted">签发具名 token 后，你的 Agent 可以代你建单、回复、交付和修订说明。</p><table class="table"><tr><th>名字</th><th>状态</th><th>草稿</th><th></th></tr><tr><td><b>codex-1</b><br><small>创建于 09-02</small></td><td><span class="badge-use">使用中</span></td><td><button class="switch" onclick="toggleMode('codex-1')"><span class="dot ${modes['codex-1']=='direct'?'off':''}"></span>${modes['codex-1']=='draft'?'必须走草稿':'可直接发'}</button></td><td style="width:1%;white-space:nowrap"><button class="ghost">换新</button> <button class="danger">撤销</button></td></tr><tr><td><b>cli-本机</b><br><small>创建于 08-15</small></td><td><span class="badge-use">使用中</span></td><td><button class="switch" onclick="toggleMode('cli-本机')"><span class="dot ${modes['cli-本机']=='direct'?'off':''}"></span>${modes['cli-本机']=='draft'?'必须走草稿':'可直接发'}</button></td><td><button class="ghost">换新</button> <button class="danger">撤销</button></td></tr><tr><td><b>old-bot</b><br><small>已停用</small></td><td><span class="badge-off">已停用</span></td><td class="muted">—</td><td></td></tr></table><button class="primary" onclick="setScene(6)">＋ 生成新 token</button></div>`}
function row(d){return `<button class="row" onclick="${d.scene?`setScene(${d.scene})`:`toast('跳到工单 ${d.jump} 详情里的草稿处')`}"><span style="flex:1;min-width:0"><span class="type">${d.type}</span><span class="rtitle">${d.title}</span><span class="rmeta">${d.meta}</span>${d.warn?`<span class="newchanges">${d.warn}</span>`:''}</span><span class="linkbtn">打开 ›</span></button>`}
function render(){document.getElementById('scenes').innerHTML=scenes.map((s,i)=>`<button class="scene ${scene==i+1?'on':''}" onclick="setScene(${i+1})">${i+1}. ${s}</button>`).join('');let x='';
if(scene==1)x=`<div class="bellwrap"><button class="bell" onclick="bell=!bell;render()">🔔</button>${bell?`<div class="bellpanel"><button class="note agent" onclick="setScene(3)"><b>你的 Agent 写了草稿待确认</b><small>codex-1 · 报销系统导出… · 15:40</small></button><button class="note" onclick="setScene(3)"><b>王工 补充了工单 #128</b><small>10-21 14:55</small></button><button class="note"><b>#117 说明修订了</b><small>10-20 09:12</small></button></div>`:''}</div><div class="card"><h2>通知</h2><p class="muted">草稿不进收件箱，只在铃铛里提醒你确认。</p></div>`;
if(scene==2)x=`<div class="pagehead"><div><h1>我的草稿</h1><p>只有你能看到 · 4 份待确认</p></div></div><div class="group"><h2>建单草稿</h2>${drafts.filter(d=>d.type=='建单草稿').map(row).join('')}</div><div class="group"><h2>工单上的草稿</h2>${drafts.filter(d=>d.type!='建单草稿').map(row).join('')}</div>`;
if([3,4].includes(scene))x=`<div class="pagehead"><div><h1>建单草稿预览</h1><p>外形与工单详情一致；标签、指派、访客链接发出时生效</p></div><button class="ghost" onclick="setScene(2)">返回列表</button></div><div class="draftbanner"><b>草稿 · 未发布 · 只有你能看到</b><span>不占工单编号；发出前不产生时间线事件</span></div><div class="detailgrid">${detail()}${effects()}</div>`;
if(scene==5)x=`<div class="pagehead"><div><h1>我的</h1><p>张敏 · 成员</p></div></div><div class="card" onclick="setScene(2)" style="cursor:pointer"><b>✎ 我的草稿（4）</b><p class="muted">你的 Agent 写的内容等你确认</p></div>${agentTable()}`;
if(scene==6)x=`<div class="modalmask"><div class="modal"><h3>生成新 token</h3><label>名字<input style="width:100%;border:1px solid #dce2ea;border-radius:7px;padding:6px" value="codex-2"></label><div class="radio on" style="margin-top:10px"><input type="radio" checked> <b>必须走草稿（推荐）</b><small>这个 Agent 建单、回复、交付、修订说明，都会先存成草稿，你在网页上看过再发出。</small></div><label class="radio" style="margin-top:7px"><input type="radio"> <b>可直接发</b><small>它写的内容立刻对外可见，署名里不注明「经你确认」。</small></label><p class="muted">两种模式下，打标签、指派、加协作者、关闭或重开都直接生效，不走草稿。</p><div class="modalops"><button class="ghost" onclick="setScene(5)">取消</button><button class="primary" onclick="toast('已生成 token：必须走草稿')">生成</button></div></div></div><div class="card"><h1>我的</h1></div>`;
if(scene==7)x=`<div class="modalmask"><div class="modal"><h3>工单板已更新</h3><p>你的 Agent 现在写的内容会先存成草稿，你确认后才发出。<br><b>codex-1、cli-本机</b> 已改为必须走草稿；需要的话可以在「我的 → Agent」里改回可直接发。</p><div class="modalops"><button class="ghost" onclick="setScene(5)">去看 Agent 设置</button><button class="primary" onclick="setScene(1)">知道了</button></div></div></div><div class="card"><h1>工单板</h1></div>`;
document.getElementById('app').innerHTML=x;document.querySelectorAll('.toast,.modalmask[data-modal],.actionbar').forEach(n=>n.remove());
if([3,4].includes(scene)){let ops=editing?`<button class="ghost" onclick="editing=false;render()">取消</button><button class="primary" onclick="editing=false;toast('已保存为第 3 版：张敏 修改');render()">保存修改</button>`:`<button class="danger" onclick="modal='discard';render()">丢弃</button><button class="ghost" onclick="copyCommand()">复制修改指令</button><button class="ghost" onclick="editing=true;render()">直接修改</button><button class="primary" onclick="modal='send';render()">发出</button>`;document.body.insertAdjacentHTML('beforeend',`<div class="actionbar"><div class="actioninner">${ops}</div></div>`)}
if(modal){let h=modal=='discard'?`<h3>丢弃建单草稿？</h3><p>丢弃即删除，不留档。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="danger" onclick="modal=null;setScene(2)">确认丢弃</button></div>`:modal=='send'?`<h3>发出建单草稿？</h3><div class="history"><div>标签：系统:报销 · 优先级:中</div><div>指派：李工</div><div>访客链接：财务部 王芳 · 14 天</div></div><p>发出后署名为「张敏 的 Agent · codex-1 · 经张敏确认」。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="primary" onclick="modal=null;sendDone()">确认发出</button></div>`:`<h3>改为可直接发？</h3><p>这个 Agent 写的内容将立刻对外可见，署名里不注明「经你确认」。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="primary" onclick="modes[modalKey]='direct';modal=null;toast('已切换为可直接发');render()">确认</button></div>`;document.body.insertAdjacentHTML('beforeend',`<div class="modalmask" data-modal><div class="modal">${h}</div></div>`)}}
function toggleMode(k){if(modes[k]=='draft'){modal='tomode';modalKey=k;render()}else{modes[k]='draft';toast('已切换为必须走草稿');render()}}
function setScene(n){scene=n;editing=n==4;showHistory=false;modal=null;bell=n==1;render()}
function toast(t,pre){let old=document.querySelector('.toast');old&&old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">${t}${pre?`<pre>${esc(pre)}</pre>`:''}</div>`);clearTimeout(toastTimer);toastTimer=setTimeout(()=>{let t=document.querySelector('.toast');t&&t.remove()},3600)}
function copyCommand(){try{navigator.clipboard.writeText(command)}catch(_){}toast('✓ 已复制修改指令',command)}
function sendDone(){toast('已发出：张敏 的 Agent · codex-1 · 经张敏确认');setScene(2)}
render();
</script></body></html>
