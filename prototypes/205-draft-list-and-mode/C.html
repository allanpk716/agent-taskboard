<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>候选 C · 全局提醒胶囊 + 抽屉</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#222;font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.scenebar{position:sticky;top:0;z-index:1000;background:#1f2937;color:#fff;padding:8px 14px}.scenebar-top{display:flex;justify-content:space-between;font-size:13px;color:#dbe2ea}.scenes{display:flex;gap:6px;overflow:auto;padding:7px 0}.scene{background:#374151;color:#d1d5db;border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}.scene.on{background:#e0a100;color:#262100;font-weight:700}
.desk{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 51px)}.side{background:#fff;border-right:1px solid #e2e6ee;padding:16px}.brand{font-weight:900;color:#243b57;margin:0 8px 12px}.nav{display:block;width:100%;text-align:left;padding:8px;background:none;color:#526274;border-radius:7px}.nav.on{background:#e9f1ff;color:#245ba8;font-weight:700}.main{padding:16px}.mobilehead{display:none}.card{background:#fff;border:1px solid #e3e7ef;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0000000a}.muted{color:#73808c;font-size:13px}.pilldraft{border:2px dashed #e0a100;background:#fffaf0;color:#9a5b00;border-radius:999px;padding:4px 9px;font-size:13px}.bellwrap{position:relative}.bell{position:relative;background:none;font-size:18px}.bell::after{content:"2";position:absolute;right:-7px;top:-6px;background:#d64545;color:#fff;border-radius:999px;font-size:10px;padding:0 4px}.bellpanel{position:absolute;right:0;top:35px;width:330px;background:#fff;border:1px solid #dfe4ec;border-radius:10px;padding:8px;box-shadow:0 18px 45px #0002;z-index:110}.note{display:block;width:100%;text-align:left;padding:9px;background:none}.note.agent{background:#fffaf0;border:1px dashed #d8ab34}.note small{display:block;color:#76828e}
.drawermask{position:fixed;inset:0;background:#11182755;z-index:130}.drawer{position:fixed;z-index:140;background:#fff;box-shadow:-16px 0 50px #0003;animation:in .2s}.deskdrawer{right:0;top:0;bottom:0;width:min(390px,92vw);padding:15px;overflow:auto}.mobiledrawer{left:0;right:0;bottom:0;border-radius:18px 18px 0 0;max-height:82vh;overflow:auto;padding:15px}@keyframes in{from{transform:translateY(100%)}}.dcard{display:block;width:100%;text-align:left;background:repeating-linear-gradient(-45deg,#fffaf0 0 10px,#fff6e0 10px 20px);border:1px dashed #e0a100;border-radius:9px;padding:10px;margin-top:8px}.summary{font-size:13px;color:#6a4d00;margin-top:4px}.drafttag{background:#e0a100;color:#fff;border-radius:4px;padding:2px 7px;font-size:12px;font-weight:700}
.stage{border:8px dashed #e0a100;border-radius:18px;padding:14px;background:#fff;margin-top:12px}.toolbar{position:sticky;top:51px;background:#fff;border-bottom:1px dashed #d8ab34;padding:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:20}.detail h2{margin:10px 0 0}.meta{display:flex;flex-wrap:wrap;gap:6px;color:#67737f;font-size:13px;margin-top:7px}.field{margin-top:11px}.q{font-size:12px;color:#77828e}.who{font-size:13px;color:#7a5200;margin:8px 0}.who b{color:#9a5b00}.history{background:#f5f7f9;border-radius:8px;padding:9px;font-size:13px;color:#55606c;margin-top:7px}.ops{display:flex;gap:7px;flex-wrap:wrap}.primary{background:#2a6fdb;color:#fff;border-radius:8px;padding:5px 11px}.ghost{background:#eef3fc;color:#2a6fdb;border-radius:8px;padding:5px 11px}.danger{color:#d64545;border:1px solid #dfa4a4;background:#fff;border-radius:8px;padding:5px 11px}
.agentrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f5;padding:10px 0}.state{background:#e8f7ef;color:#237a4e;border-radius:999px;padding:1px 7px;font-size:12px}.menumask{position:fixed;inset:0;background:#11182755;z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}.menu{background:#fff;border-radius:10px;padding:13px;width:min(400px,100%)}.menu button{display:block;width:100%;text-align:left;padding:9px;border-radius:7px;background:none}.menu button.on{background:#fffaf0;color:#9a5b00;font-weight:700}.bigchoice{border:2px solid #dce2ea;border-radius:10px;padding:12px;display:block;margin-top:9px;background:#fff;text-align:left}.bigchoice.on{border-color:#e0a100;background:#fffaf0;color:#7a5200}
.modalmask{position:fixed;inset:0;background:#11182766;display:flex;align-items:center;justify-content:center;padding:16px;z-index:160}.modal{width:min(520px,100%);background:#fff;border-radius:10px;padding:17px}.modal h3{margin:0 0 8px}.check{border:1px dashed #d8ab34;background:#fffaf0;color:#7a5200;border-radius:8px;padding:9px;margin-top:8px}.check input,.check select{width:100%;border:1px solid #d8ab34;background:#fff;border-radius:6px;padding:4px;color:#7a5200;margin-top:4px}.modalops{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.toast{position:fixed;left:16px;right:16px;bottom:20px;margin:auto;max-width:600px;background:#1f2937;color:#fff;border-radius:9px;padding:11px;z-index:180}.toast pre{font:11px/1.5 Consolas,monospace;color:#cbd5e1;white-space:pre-wrap}.toastlink{color:#ffd977;text-decoration:underline}
@media(max-width:899px){.desk{grid-template-columns:1fr}.side{display:none}.mobilehead{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #e2e6ee;position:sticky;top:51px;z-index:100}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe4ec}.bottom button{background:none;padding:7px;color:#687585;font-size:11px}.stage{border-radius:12px}}@media(min-width:900px){.bottom{display:none}}
</style></head><body><div class="scenebar"><div class="scenebar-top"><b>候选 C · 全局提醒胶囊 + 抽屉</b><span>张敏 · 成员</span></div><div class="scenes" id="scenes"></div></div><div class="mobilehead"><b>工单板</b><div class="bellwrap" style="display:flex;gap:9px;align-items:center"><button class="bell" onclick="bell=!bell;render()">🔔</button><button class="pilldraft" onclick="drawer=true;render()">✎ 4 份草稿待确认</button></div></div><div class="desk"><aside class="side"><h1 class="brand">工单板</h1><button class="primary" style="border-radius:8px;padding:8px">＋ 建单</button><button class="nav">📥 收件箱</button><button class="nav on">🗂 工单</button><button class="nav">🧰 工具</button><button class="nav" onclick="setScene(5)">👤 我的</button><div style="margin-top:12px"><button class="pilldraft" onclick="drawer=true;render()">✎ 4 份草稿待确认</button></div></aside><main class="main" id="app"></main></div><div class="bottom"><button>收件箱</button><button>工单</button><button>＋</button><button>工具</button><button onclick="setScene(5)">我的</button></div><script>
const scenes=['通知','我的草稿','建单草稿预览','发出前改标签/指派','Agent 设置','签发新 token','上线提示'];let scene=3,bell=false,drawer=false,modal=null,menu='',history=false,modes={'codex-1':'draft','cli-本机':'direct'};const command='请修改建单草稿「报销系统导出 Excel 时金额列变成科学计数法」（第 2 版）：金额列需保留原数字格式；可补充截图说明 Excel 的单元格格式设置。保存为第 3 版。';const drafts=[['建单草稿','报销系统导出 Excel 时金额列变成科学计数法','系统：报销系统。现象：导出后金额列显示为 1.23E+05。','codex-1 · 第 2 版 · 10-21 15:40'],['建单草稿','Q4 采购审批流程梳理','Q4 采购需要按金额分档，先梳理现有审批节点和例外场景。','codex-1 · 第 1 版 · 10-20 18:02'],['回复草稿','#128 供应商对账单导入失败','已定位导入失败与编码有关，建议先用样例文件重试。','codex-1 · 第 3 版 · 10-21 14:05'],['说明修订草稿','#117 门禁卡权限申请','将说明修订为按楼层和有效期申请门禁权限。','codex-1 · 第 1 版 · 10-19 11:30']];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}function openDraft(i){if(i<2)setScene(3);else if(i==2)toast('跳到工单 #128 详情里的草稿处');else toast('跳到工单 #117 详情里的草稿处')}function drawerHTML(){return `<div class="drawermask" onclick="drawer=false;render()"></div><div class="drawer ${matchMedia('(max-width:899px)').matches?'mobiledrawer':'deskdrawer'}"><div style="display:flex;justify-content:space-between"><b>我的草稿（4）</b><button class="ghost" onclick="drawer=false;render()">关闭</button></div><p class="muted">只有你能看到</p>${drafts.map((d,i)=>`<button class="dcard" onclick="openDraft(${i})"><span class="drafttag" style="margin-right:6px">${d[0]}</span><b>${d[1]}</b><div class="summary">${d[2]}</div><div class="muted">${d[3]}</div></button>`).join('')}</div>`}
function preview(){return `<div class="stage"><div class="toolbar"><span class="drafttag">草稿 · 未发布</span><div class="ops"><button class="danger" onclick="modal='discard';render()">丢弃</button><button class="ghost" onclick="copyCommand()">复制修改指令</button><button class="ghost" onclick="toast('已进入直接修改，保存后为第 3 版：张敏 修改')">直接修改</button><button class="primary" onclick="modal='check';render()">发出</button></div></div><div class="card detail" style="border:0;box-shadow:none"><div class="meta"><span>编号在发出时分配</span><span>模板：缺陷反馈</span></div><h2>报销系统导出 Excel 时金额列变成科学计数法</h2><div class="who"><b>codex-1（你的 Agent）</b>写的建单草稿 · 第 2 版 · 10-21 15:40 <button style="color:#2a6fdb;background:none" onclick="history=!history;render()">${history?'收起':'查看起草过程（2 版）'}</button>${history?'<div class="history"><div>第 1 版 · codex-1 写 · 10-21 15:10</div><div>第 2 版 · codex-1 修改 · 10-21 15:40</div></div>':''}</div><div class="field"><div class="q">系统</div>报销系统</div><div class="field"><div class="q">现象</div>导出后金额列显示为 1.23E+05</div><div class="field"><div class="q">复现步骤</div>1. 导出 10 月报销明细<br>2. 打开 xlsx<br>3. 查看金额列</div><div class="field"><div class="q">期望</div>保持原数字格式</div><div class="field"><div class="q">附件</div>📎 导出样例.xlsx</div></div></div>`}
function agentCard(){return `<div class="card"><h2>Agent</h2><p class="muted">签发具名 token 后，你的 Agent 可以代你建单、回复、交付和修订说明。</p>${[['codex-1','09-02'],['cli-本机','08-15']].map(([k,d])=>`<div class="agentrow"><span><b>${k}</b><br><small class="muted">创建于 ${d}</small></span><button class="pilldraft" onclick="menu='${k}';render()">草稿：${modes[k]=='draft'?'必须':'可直接发'}</button></div>`).join('')}<div class="agentrow"><span><b>old-bot</b><br><small class="muted">已停用</small></span><span class="muted">—</span></div><button class="primary" onclick="setScene(6)">＋ 生成新 token</button></div>`}
function render(){document.getElementById('scenes').innerHTML=scenes.map((s,i)=>`<button class="scene ${scene==i+1?'on':''}" onclick="setScene(${i+1})">${i+1}.${s}</button>`).join('');let x='';
if(scene==1)x=`<div class="bellwrap"><button class="bell" onclick="bell=!bell;render()">🔔</button>${bell?'<div class="bellpanel"><button class="note agent"><b>你的 Agent 写了草稿待确认</b><small>codex-1 · 报销系统导出… · 15:40</small></button><button class="note" onclick="setScene(3)"><b>王工 补充了工单 #128</b></button><button class="note"><b>系统维护提醒</b></button></div>':''}</div><div class="card"><h1>通知</h1></div>`;if(scene==2){x='<div class="card"><h1>我的草稿（4）</h1><p class="muted">点击右上角胶囊可随时打开抽屉。</p></div>';drawer=true}if([3,4].includes(scene))x='<h1>建单草稿预览</h1>'+preview();if(scene==5)x='<h1>我的</h1><div class="card" onclick="setScene(2)" style="cursor:pointer">✎ 我的草稿（4）</div>'+agentCard();if(scene==6)x='<div class="modalmask"><div class="modal"><h3>生成新 token · 第 1 步 / 2</h3><label>名字<input style="width:100%;border:1px solid #dce2ea;border-radius:7px;padding:6px" value="codex-2"></label><div class="modalops"><button class="ghost" onclick="setScene(5)">取消</button><button class="primary" onclick="tokenStep=2;render()">下一步</button></div></div></div><div class="card"><h1>我的</h1></div>';if(scene==6&&tokenStep==2)x='<div class="modalmask"><div class="modal"><h3>这个 Agent 说话前要先经你确认吗？</h3><button class="bigchoice on"><b>必须先确认</b><br><small>建单、回复、交付、修订说明都会先存成草稿，你看过再发出。</small></button><button class="bigchoice"><b>可直接发</b><br><small>立刻对外可见，署名不注明「经你确认」。</small></button><p class="muted">打标签、指派、加协作者、关闭或重开都直接生效。</p><div class="modalops"><button class="ghost" onclick="tokenStep=1;render()">上一步</button><button class="primary" onclick="toast(\'已生成 token：必须先确认\')">生成</button></div></div></div><div class="card"><h1>我的</h1></div>';if(scene==7)x='<div class="card"><h1>工单板</h1><p>上线迁移提示见铃铛与 toast。</p></div>';document.getElementById('app').innerHTML=x;document.querySelectorAll('[data-modal],.drawermask,.drawer,.toast,.fixednote').forEach(n=>n.remove());if(drawer&&scene!=6)document.body.insertAdjacentHTML('beforeend',drawerHTML());if(scene==1&&!bell){bell=true;render()}if(scene==7)document.body.insertAdjacentHTML('beforeend',`<div class="bellpanel fixednote" style="position:fixed;right:18px;top:64px;z-index:190"><button class="note agent"><b>工单板已更新</b><small>你的 Agent 现在写的内容会先存成草稿；codex-1、cli-本机 已改为必须走草稿。</small></button></div>`);if(scene==7)toast('<span>工单板已更新：你的 Agent 现在写的内容会先存成草稿。codex-1、cli-本机 已改为必须走草稿。</span> <button class="toastlink" onclick="setScene(5)">去改设置</button>');
if(menu)document.body.insertAdjacentHTML('beforeend',`<div class="menumask" onclick="menu='';render()"><div class="menu" onclick="event.stopPropagation()"><h3>${menu} 的草稿模式</h3><button class="${modes[menu]=='draft'?'on':''}" onclick="modes[menu]='draft';menu='';render()">必须走草稿（推荐）</button><button onclick="switchMode('${menu}')">可直接发</button><p class="muted">可直接发时，它写的内容立刻对外可见。</p></div></div>`);
if(modal)document.body.insertAdjacentHTML('beforeend',`<div class="modalmask" data-modal><div class="modal">${modal=='discard'?'<h3>丢弃建单草稿？</h3><p>丢弃即删除，不留档。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="danger" onclick="modal=null;setScene(2)">确认丢弃</button></div>':modal=='mode'?'<h3>改为可直接发？</h3><p>它写的内容将立刻对外可见，署名里不注明「经你确认」。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">取消</button><button class="primary" onclick="modes[menu]=&#39;direct&#39;;menu=&#39;&#39;;modal=null;render();toast(&#39;已切换为可直接发&#39;)">确认</button></div>':'<h3>发出前核对</h3><p>以下项目发出时才生效，可现在修改。</p><label class="check">标签<input value="系统:报销；优先级:中"></label><label class="check">指派<select><option>李工</option><option>赵工</option></select></label><label class="check">访客链接<select><option>财务部 王芳 · 14 天</option><option>财务部 王芳 · 7 天</option></select></label><p>发出后署名「张敏 的 Agent · codex-1 · 经张敏确认」。</p><div class="modalops"><button class="ghost" onclick="modal=null;render()">返回修改</button><button class="primary" onclick="modal=null;sendDone()">确认发出</button></div>'}</div></div>`)}
let tokenStep=1;function setScene(n){scene=n;modal=null;menu='';history=false;bell=n==1;drawer=n==2;tokenStep=1;render()}function switchMode(k){modal='mode';render()}function toast(t,p){let old=document.querySelector('.toast');old&&old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">${t}${p?'<pre>'+esc(p)+'</pre>':''}</div>`);setTimeout(()=>{let x=document.querySelector('.toast');x&&x.remove()},3800)}function copyCommand(){try{navigator.clipboard.writeText(command)}catch(_){}toast('✓ 已复制修改指令',command)}function sendDone(){toast('已发出：张敏 的 Agent · codex-1 · 经张敏确认');setScene(2)}render();
</script></body></html>
