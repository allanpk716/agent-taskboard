<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>收件箱 · 方案 A 手机端</title>
  <style>
    :root {
      --blue: #2a6fdb;
      --green: #23a06b;
      --guest: #22707a;
      --amber: #d98a2b;
      --ink: #22304a;
      --body: #2f384a;
      --muted: #697386;
      --faint: #7d8798;
      --line: #dde3ee;
      --page: #eef1f6;
      --card: #ffffff;
      --amber-bg: #fff1d6;
      --amber-text: #a35f00;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--body);
      font: 15px/1.58 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    }

    button {
      border: 0;
      font: inherit;
      color: inherit;
      background: none;
      cursor: pointer;
    }

    .app {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--page);
      position: relative;
    }

    /* 吸顶头栏：标题保持稳定，分段切换始终可用。 */
    .inbox-head {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 10px;
      background: rgba(255, 255, 255, .97);
      border-bottom: 1px solid #e3e8f1;
      box-shadow: 0 1px 8px rgba(34, 48, 74, .05);
      backdrop-filter: blur(10px);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 36px;
      margin-bottom: 9px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -.2px;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    h1 small {
      font-size: 14px;
      font-weight: 750;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
    }

    .today {
      flex: none;
      color: var(--faint);
      font-size: 11.5px;
      font-weight: 500;
    }

    .view-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      min-height: 44px;
      padding: 3px;
      border-radius: 10px;
      background: #e6ebf4;
      box-shadow: inset 0 1px 2px rgba(34, 48, 74, .07);
    }

    .view-switch button {
      min-height: 40px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 14.5px;
      font-weight: 650;
      transition: background .16s ease, color .16s ease, box-shadow .16s ease;
    }

    .view-switch button[aria-selected="true"] {
      color: #24589f;
      background: #fff;
      box-shadow: 0 1px 4px rgba(34, 48, 74, .12);
    }

    .list {
      padding: 12px 12px 16px;
      display: grid;
      gap: 10px;
    }

    .card {
      position: relative;
      display: block;
      overflow: hidden;
      min-height: 44px;
      padding: 12px 13px 12px 15px;
      border-radius: 11px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(34, 48, 74, .06);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .card:active { transform: scale(.996); }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #a7b0c2;
    }

    .card.reason-new::before,
    .card.reason-question::before { background: var(--blue); }
    .card.reason-delivered::before { background: var(--green); }
    .card.reason-guest::before { background: var(--guest); }
    .card.reason-return::before { background: var(--amber); }

    .first-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-height: 22px;
    }

    .phrase {
      min-width: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.35;
      letter-spacing: -.1px;
    }

    .phrase em {
      font-style: normal;
      color: #3f5b84;
    }

    time {
      flex: none;
      color: var(--faint);
      font-size: 12px;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }

    .title {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: 7px 0 0;
      color: var(--ink);
      font-size: 15.5px;
      line-height: 1.45;
      font-weight: 430;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .card.unread .title { font-weight: 760; }

    .unread-dot {
      flex: none;
      width: 7px;
      height: 7px;
      margin-top: 8px;
      border-radius: 50%;
      background: #e5554f;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .meta b {
      font-weight: 650;
      color: #59657d;
    }

    .meta .sep { color: #b8c0d0; }

    .chips {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 5px;
      background: #eef2f9;
      color: #5d6a84;
      font-size: 11.5px;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* 按人视图：组头贴在吸顶头栏之下，等待项默认弱化并折叠。 */
    .person-view { display: grid; gap: 10px; }

    .group {
      border-radius: 12px;
      background: #f4f7fb;
      /* overflow:hidden would turn each group into the sticky containing
         scrollport and push the header 114px below its expected position. */
      box-shadow: 0 1px 3px rgba(34, 48, 74, .05);
    }

    .group-head {
      position: sticky;
      top: var(--inbox-head-height, 114px);
      z-index: 20;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 8px 13px;
      border-bottom: 1px solid rgba(221, 227, 238, .94);
      background: #fff;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #dce8fb;
      color: #25589f;
      font-size: 15px;
      font-weight: 750;
    }

    .avatar.agent { background: #e5e9fb; color: #5561a8; }
    .avatar.inbox { background: #eceff5; color: #67718a; }

    .person-name {
      min-width: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .person-name strong {
      min-width: 0;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.3;
    }

    .person-name span {
      flex: none;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }

    .group-body {
      display: grid;
      gap: 8px;
      padding: 8px;
    }

    .group-body .card {
      border: 1px solid rgba(221, 227, 238, .7);
      box-shadow: none;
    }

    .wait-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      margin-top: -1px;
      padding: 0 13px;
      border-radius: 9px;
      background: #e9edf5;
      color: #5f6b83;
      font-size: 13.5px;
      font-weight: 650;
      text-align: left;
    }

    .wait-toggle[aria-expanded="true"] {
      color: #4d5d78;
      background: #e2e8f3;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .wait-toggle .arrow {
      flex: none;
      color: #8b95a8;
      font-size: 13px;
      transition: transform .16s ease;
    }

    .wait-toggle[aria-expanded="true"] .arrow { transform: rotate(90deg); }

    .wait-list {
      display: grid;
      gap: 8px;
      padding: 0 8px 8px;
    }

    .wait-list[hidden] { display: none; }

    .card.waiting {
      background: #f1f3f8;
      border: 1px solid #e0e5ef;
      box-shadow: none;
    }

    .card.waiting::before { background: #aeb7c8; }

    .card.waiting .phrase {
      color: #657088;
      font-weight: 650;
    }

    .card.waiting .title {
      color: #5c677c;
      font-weight: 430;
    }

    [role="tabpanel"][hidden] { display: none; }

    /* 手机端底部固定标签栏。 */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: calc(62px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(255, 255, 255, .98);
      border-top: 1px solid #e0e6f0;
      backdrop-filter: blur(12px);
    }

    .tabbar a {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      min-height: 48px;
      color: #76819a;
      text-decoration: none;
      font-size: 10.8px;
      line-height: 1.2;
    }

    .tabbar span:first-child {
      font-size: 18px;
      line-height: 1;
    }

    .tabbar .active {
      color: #24589f;
      font-weight: 700;
    }

    .tabbar .inbox-count {
      position: relative;
    }

    .tabbar .inbox-count::after {
      content: "9";
      position: absolute;
      top: 5px;
      right: 50%;
      margin-right: -22px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border-radius: 8px;
      background: #e5554f;
      color: #fff;
      font-size: 9.5px;
      line-height: 15px;
      text-align: center;
    }

    @media (max-width: 320px) {
      .list, .inbox-head { padding-left: 10px; padding-right: 10px; }
      .title { font-size: 15px; }
      .group-head { padding: 8px 11px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="inbox-head">
    <div class="title-row">
      <h1>收件箱 <small>9</small></h1>
      <div class="today" title="2026-11-03 16:30">11月3日 16:30</div>
    </div>
    <div class="view-switch" role="tablist" aria-label="收件箱视图">
      <button type="button" id="time-tab" role="tab" aria-selected="true" aria-controls="time-view">按时间</button>
      <button type="button" id="person-tab" role="tab" aria-selected="false" aria-controls="person-view">按人</button>
    </div>
  </header>

  <main>
    <section id="time-view" role="tabpanel" aria-labelledby="time-tab" class="list" aria-label="按时间的收件箱"></section>
    <section id="person-view" role="tabpanel" aria-labelledby="person-tab" class="person-view" aria-label="按往来对象分组的收件箱" hidden></section>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <a href="#" class="active"><span class="inbox-count">⌂</span><span>收件箱</span></a>
    <a href="#"><span>☰</span><span>全部</span></a>
    <a href="#"><span>⇄</span><span>协作</span></a>
    <a href="#"><span>👤</span><span>我的</span></a>
  </nav>
</div>

<script>
"use strict";

const inbox = [
  { id:"T-0412", type:"任务", title:"生产线 3 号机型在高温环境下连续运行 48 小时后出现间歇性通讯中断，需要排查固件看门狗和 CAN 总线重连逻辑并给出修复方案", phrase:"张三 派给你", actor:"张三", reason:"new", owner:"张三", founder:"张三", last:"20 分钟前", full:"2026-11-03 16:10", unread:true, tags:["产品线/A100", "系统/固件"] },
  { id:"T-0408", type:"任务", title:"季度报表导出", phrase:"李四 交付了，等你验收", actor:"李四", reason:"delivered", owner:"李四", founder:"陈明", last:"1 小时前", full:"2026-11-03 15:30", unread:true, tags:["部门/质量"] },
  { id:"T-0405", type:"反馈", title:"客户反馈：设备开机界面在英文系统下有一半文字显示为乱码，截图见附件，客户希望下个版本修复", phrase:"访客 王五 回复了", actor:"王五", reason:"guest", owner:"王五（访客）", founder:"王五（访客）", last:"2 小时前", full:"2026-11-03 14:30", unread:true, tags:["系统/界面"] },
  { id:"T-0401", type:"任务", title:"更新内部部署手册", phrase:"张三 回复了，问你一个问题", actor:"张三", reason:"question", owner:"张三", founder:"张三", last:"5 小时前", full:"2026-11-03 11:30", unread:false, tags:[] },
  { id:"T-0398", type:"任务", title:"整理我自己的周计划模板", phrase:"你的 Agent 回复了", actor:"我自己", reason:"agent", owner:"我自己", founder:"陈明", last:"昨天 18:05", full:"2026-11-02 18:05", unread:false, tags:[] },
  { id:"T-0396", type:"任务", title:"新员工账号批量开通", phrase:"赵六 新建，等你初筛", actor:"赵六", reason:"triage", owner:"待初筛", founder:"赵六", last:"创建于 昨天 10:12", full:"2026-11-02 10:12", unread:true, tags:[] },
  { id:"T-0390", type:"任务", title:"算法模块 v2 接口文档与旧版本的差异对照表，需要覆盖所有已废弃字段以及新增置信度参数说明", phrase:"李四 退回了，要你修改", actor:"李四", reason:"return", owner:"李四", founder:"李四", last:"2 天前", full:"2026-11-01 16:30", unread:false, tags:["算法/检测"] },
  { id:"T-0385", type:"反馈", title:"打印模块偶发卡纸", phrase:"访客 王五 还没填说明", actor:"王五", reason:"guest", owner:"王五（访客）", founder:"陈明", last:"创建于 3 天前", full:"2026-10-31 10:00", unread:false, tags:[] },
  { id:"T-0380", type:"任务", title:"测试环境数据库迁移", phrase:"李四 改派给你", actor:"李四", reason:"new", owner:"张三", founder:"张三", last:"4 天前", full:"2026-10-30 15:20", unread:false, tags:["系统/后端"] }
];

const waiting = [
  { id:"T-0410", title:"采购申请：示波器两台", phrase:"等 张三 处理 · 3 小时前", owner:"张三", last:"3 小时前", full:"2026-11-03 13:30" },
  { id:"T-0402", title:"质检规范 2026 版修订，请按新国标逐条核对并标注差异", phrase:"等 李四 处理 · 1 天前", owner:"李四", last:"1 天前", full:"2026-11-02 15:30" },
  { id:"T-0399", title:"会议室投影仪维修", phrase:"等 李四 处理 · 2 天前", owner:"李四", last:"2 天前", full:"2026-11-01 14:00" },
  { id:"T-0377", title:"版本发布说明", phrase:"等 李四 处理 · 5 天前", owner:"李四", last:"5 天前", full:"2026-10-29 11:20" },
  { id:"T-0388", title:"客户现场问题补充信息", phrase:"等 访客 王五 回复 · 3 天前", owner:"王五（访客）", last:"3 天前", full:"2026-10-31 16:30" }
];

const groups = [
  { name:"张三", initial:"张", mine:3, waiting:1 },
  { name:"李四", initial:"李", mine:2, waiting:3 },
  { name:"王五（访客）", initial:"王", mine:2, waiting:1 },
  { name:"我自己", initial:"我", mine:1, waiting:0, avatarClass:"agent" },
  { name:"待初筛", initial:"筛", mine:1, waiting:0, avatarClass:"inbox" }
];

const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
})[ch]);

function inboxCard(item) {
  const dot = item.unread ? '<i class="unread-dot" aria-hidden="true"></i>' : "";
  const chips = item.tags.map(tag => `<span class="chip">${escapeHtml(tag)}</span>`).join("");
  return `
    <a class="card reason-${escapeHtml(item.reason)}${item.unread ? " unread" : ""}" href="#" data-id="${escapeHtml(item.id)}">
      <span class="first-line">
        <strong class="phrase">${escapeHtml(item.phrase)}</strong>
        <time datetime="${escapeHtml(item.full)}" title="${escapeHtml(item.full)}">${escapeHtml(item.last)}</time>
      </span>
      <span class="title">${dot}<span>${escapeHtml(item.title)}</span></span>
      <span class="meta">
        <b>${escapeHtml(item.id)}</b><span class="sep">·</span><span>${escapeHtml(item.type)}</span><span class="sep">·</span><span>发起人 ${escapeHtml(item.founder)}</span>
      </span>
      ${chips ? `<span class="chips">${chips}</span>` : ""}
    </a>`;
}

function waitingCard(item) {
  return `
    <a class="card waiting" href="#" data-id="${escapeHtml(item.id)}">
      <span class="first-line">
        <strong class="phrase">${escapeHtml(item.phrase)}</strong>
        <time datetime="${escapeHtml(item.full)}" title="${escapeHtml(item.full)}">${escapeHtml(item.last)}</time>
      </span>
      <span class="title"><span>${escapeHtml(item.title)}</span></span>
    </a>`;
}

function render() {
  document.getElementById("time-view").innerHTML = inbox.map(inboxCard).join("");

  document.getElementById("person-view").innerHTML = groups.map(group => {
    const mineItems = inbox.filter(item => item.owner === group.name);
    const waitItems = waiting.filter(item => item.owner === group.name);
    const waitBlock = waitItems.length ? `
      <button class="wait-toggle" type="button" aria-expanded="false" aria-controls="${group.initial}-waiting">
        <span>在等他 ${waitItems.length} 张</span><span class="arrow" aria-hidden="true">▸</span>
      </button>
      <div class="wait-list" id="${group.initial}-waiting" hidden>
        ${waitItems.map(waitingCard).join("")}
      </div>` : "";

    return `
      <section class="group" aria-label="${escapeHtml(group.name)}">
        <div class="group-head">
          <span class="avatar ${group.avatarClass || ""}" aria-hidden="true">${escapeHtml(group.initial)}</span>
          <span class="person-name">
            <strong>${escapeHtml(group.name)}</strong>
            <span>轮到我 ${mineItems.length} · 等他 ${waitItems.length}</span>
          </span>
        </div>
        <div class="group-body">${mineItems.map(inboxCard).join("")}</div>
        ${waitBlock}
      </section>`;
  }).join("");

  document.querySelectorAll(".wait-toggle").forEach(button => {
    button.addEventListener("click", () => {
      const expanded = button.getAttribute("aria-expanded") === "true";
      const list = document.getElementById(button.getAttribute("aria-controls"));
      button.setAttribute("aria-expanded", String(!expanded));
      list.hidden = expanded;
    });
  });
}

const tabs = [
  { button:document.getElementById("time-tab"), panel:document.getElementById("time-view") },
  { button:document.getElementById("person-tab"), panel:document.getElementById("person-view") }
];

tabs.forEach(({ button, panel }) => {
  button.addEventListener("click", () => {
    tabs.forEach(item => {
      item.button.setAttribute("aria-selected", String(item.button === button));
      item.panel.hidden = item.button !== button;
    });
  });
});

document.addEventListener("click", event => {
  if (event.target.closest('a[href="#"]')) event.preventDefault();
});

function syncGroupStickyOffset() {
  const head = document.querySelector(".inbox-head");
  document.documentElement.style.setProperty(
    "--inbox-head-height",
    `${head.getBoundingClientRect().height}px`
  );
}

render();
syncGroupStickyOffset();
window.addEventListener("resize", syncGroupStickyOffset);
</script>
</body>
</html>
