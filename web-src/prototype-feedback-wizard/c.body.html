<div class="proto"><b>候选 C · 收件箱内嵌快建</b> 不跳页，首页顶部就能发；下面列「我发出去的反馈请求」<span style="flex:1"></span><button data-mode="phone" class="on" onclick="setMode('phone')">📱 手机</button><button data-mode="pc" onclick="setMode('pc')">🖥 电脑</button></div>
<style>.qk{background:#fff;border:1.5px solid #2a6fdb;border-radius:12px;margin:12px;padding:12px 14px}.qk .h{font-weight:700;margin-bottom:8px}.qk input{margin-bottom:8px}.row{display:flex;gap:8px}.sent .it{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f2f6;font-size:13px}.sent .it:last-child{border:0}.st{font-size:12px}.st.w{color:#9aa3b2}.st.r{color:#b45309;font-weight:600}
.pcgrid{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}.pcgrid .qk{margin:0 0 14px}</style>
<div id="phone"><div class="top"><span class="logo">工单台</span><span class="ver">v0.2.0</span></div><div id="ph"></div><div style="height:60px"></div>
<div class="tabbar"><div class="on">收件箱</div><div>工单</div><div>工具</div><div>我</div></div></div>
<div id="pcwrap"><div class="pc-shell"><div class="side"><div class="logo">工单台</div><div class="nv on">收件箱</div><div class="nv">工单</div><div class="nv">建单（高级）</div><div class="nv">模板</div><div class="nv">工具</div><div class="nv">管理</div><div class="ver">v0.2.0</div></div><div class="pc-main"><div class="pcgrid"><div id="pcl"></div><div id="pcr"></div></div></div></div></div>
<script>
const S={ph:{v:'f',who:'',title:'',tpl:'bug',days:30,more:false},pc:{v:'f',who:'',title:'',tpl:'bug',days:30,more:false}}
function qk(k){const s=S[k];if(s.v==='done'){const t=shareText(s.who||'检验科-张三',s.title||'UD-2300 质控报 E-203',s.days);return `<div class="qk"><div class="h">✓ 已创建 20261017-004 · 发给 ${s.who||'检验科-张三'}</div><div class="linkbox">${t}</div><div class="btnrow"><button class="btn" data-t="复制文案" onclick="copy(this)">复制文案</button><button class="btn ghost" data-t="只复制链接" onclick="copy(this)">只复制链接</button><button class="btn ghost" onclick="Object.assign(S.${k},{v:'f',who:'',title:''});draw()">再请一个人</button></div></div>`}
return `<div class="qk"><div class="h">请人反馈</div><input type="text" placeholder="请谁：检验科-张三" value="${s.who}" oninput="S.${k}.who=this.value;c('${k}')"><input type="text" placeholder="什么事：UD-2300 质控报 E-203" value="${s.title}" oninput="S.${k}.title=this.value;c('${k}')">
${s.more?`<div class="fld"><div class="hint">请对方填写</div><div class="chips"><span class="chip ${s.tpl==='bug'?'on':''}" onclick="S.${k}.tpl='bug';draw()">Bug 反馈</span><span class="chip ${s.tpl==='free'?'on':''}" onclick="S.${k}.tpl='free';draw()">自由描述</span></div></div><div class="fld"><div class="hint">有效期</div><div class="chips">${[7,30,90].map(d=>`<span class="chip ${s.days===d?'on':''}" onclick="S.${k}.days=${d};draw()">${d} 天</span>`).join('')}</div></div><div class="fld"><div class="hint">谁来跟进</div><select><option>我（王工）</option><option>李工</option></select></div>`:''}
<div class="row" style="align-items:center;justify-content:space-between"><span class="hint" style="cursor:pointer;color:#2a6fdb" onclick="S.${k}.more=!S.${k}.more;draw()">${s.more?'收起 ▴':(s.tpl==='bug'?'Bug 反馈':'自由描述')+' · '+s.days+' 天 · 我跟进 ▾'}</span><button id="g-${k}" class="btn" ${s.who&&s.title?'':'disabled'} onclick="S.${k}.v='done';draw()">生成链接</button></div></div>`}
function sent(){return `<div class="sec-t" style="margin-left:0">我发出去的反馈请求</div><div class="mcard sent" style="margin:0 0 14px"><div class="it"><span>UD-2300 质控报 E-203<br><span class="hint">检验科-张三</span></span><span class="st r">已回复</span></div><div class="it"><span>中间件传输失败<br><span class="hint">生化组-李四</span></span><span class="st w">还没打开</span></div><div class="it"><span>报告打印乱码<br><span class="hint">门诊-赵五</span></span><span class="st">填写中…</span></div></div>`}
function inbox(){return `<div class="sec-t" style="margin-left:0">现在轮到我 · 3</div><div class="mcard" style="margin:0 0 14px"><div class="inbox-item"><div class="why">访客回复了 · 检验科-张三</div><div class="t">UD-2300 质控报 E-203</div></div><div class="inbox-item"><div class="why">新指派</div><div class="t">整理 SL-1000 遗留问题清单</div></div><div class="inbox-item"><div class="why">已交付待验收</div><div class="t">Q3 质控规则对照表</div></div></div>`}
function c(k){const s=S[k];document.getElementById('g-'+k).disabled=!(s.who&&s.title)}
function draw(){document.getElementById('ph').innerHTML=qk('ph')+'<div style="margin:0 12px">'+inbox()+sent()+'</div>';document.getElementById('pcl').innerHTML=inbox();document.getElementById('pcr').innerHTML=qk('pc')+sent()}
draw();fit()
</script>
