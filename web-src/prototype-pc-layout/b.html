.mblk{padding:10px 0;border-bottom:1px solid #f0f2f6}.mblk:last-child{border:0}.mblk .h{font-size:11.5px;color:#9aa3b2;margin-bottom:5px;display:flex}.mblk .h a{margin-left:auto;color:#2a6fdb;cursor:pointer}
.link{font-size:12.5px;background:#f6f7f9;border-radius:7px;padding:7px 9px;margin-top:5px}.link .u{color:#2a6fdb;word-break:break-all}
.strip{background:#fafbfc;border-bottom:1px solid #e6e9f0;padding:7px 18px;font-size:12.5px;color:#4b5563;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:2px;border-bottom:1px solid #e6e9f0;background:#fff;padding:0 18px}.tabs span{padding:9px 12px;font-size:13.5px;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent}.tabs span.on{color:#2a6fdb;border-color:#2a6fdb;font-weight:600}

.card{background:#fff;border:1px solid #e6e9f0;border-radius:12px;padding:14px 16px}

// 一次性原型：PC 响应式布局（#57），不合并。数据全部写死在内存里。
const S={view:'inbox',w:1366,sel:0,open:false,tab:'convo',nav:'inbox'}

 {no:'T-0124',kind:'task',title:'升级 3 号机固件到 2.4.1 并验证',wait:'发起人验收',assignee:'王梦龙',creator:'陈工',labels:['固件','机型:UD-2300'],upd:'昨天 11:02',unread:1},
 {no:'T-0121',kind:'fb',title:'试剂余量显示与实际不符',wait:'部门（未指派）',assignee:null,creator:'李娜',guest:'急诊-周护士',labels:['待初筛'],upd:'10-14'},
 {no:'T-0119',kind:'fb',title:'质控结果导出 Excel 乱码',wait:'指派人',assignee:'李娜',creator:'李娜',labels:['机型:UD-1600','软件'],upd:'10-13'},
 {no:'T-0116',kind:'task',title:'给新同事开通成员账号',wait:'指派人',assignee:'李娜',creator:'陈工',labels:[],upd:'10-12'},

 {k:'msg',who:'陈工',role:'成员',mine:1,time:'10-15 10:20',tx:'收到。麻烦再看下清洗液瓶的管路有没有气泡？能拍一张最好。'},
 {k:'msg',who:'检验科-张三',role:'访客',time:'10-15 10:41',tx:'有一点气泡，照片发上来了。',files:['📷 管路.jpg']},
 {k:'msg',who:'陈工 的 Agent',role:'Agent',agent:1,time:'10-15 10:45',tx:'已比对日志：E21 是液路压力异常，和管路进气对得上。建议先按说明书 6.3 排气，再开机自检。'},
]
function convo(guest,noBrief){return MSGS.filter(m=>!(guest&&m.k==='sys')).map(m=>{
 if(m.k==='brief'&&noBrief)return `<div class="sys">${noBrief} · 10-15 10:03</div>`
 if(m.k==='sys')return `<div class="sys">${m.tx}</div>`
 const mine=guest?m.role==='访客':m.mine

 return `<div class="msg ${mine?'mine':''} ${m.agent?'agent':''}">${who}<div class="tx">${m.tx}</div>${fs}</div>`}).join('')}

  <div class="small" style="font-weight:600">你填写的说明 <a style="color:#2a6fdb;font-weight:400;float:right">修改</a></div><div class="qa small">${MSGS[1].qa.map(([q,a])=>`<div class="q">${q}</div><div class="a">${a}</div>`).join('')}</div>
  <div class="small" style="font-weight:600;margin-top:12px">附件</div><div class="files">${MSGS[1].files.concat(MSGS[3].files).map(f=>`<span class="file">${f}</span>`).join('')}</div>
  <div class="tiny muted" style="margin-top:12px">链接还剩 28 天有效</div></div></div></div><div class="gfoot">工单板 ${VER}</div></div>`}
 const nav=wide?side():rail()
 if(S.view==='other')return nav+other()
 if(S.view==='detail'){const t=T[S.sel];return nav+`<div class="dcol"><div class="dhead"><a class="small" style="color:#2a6fdb;cursor:pointer" onclick="go('list')">‹ 返回列表</a><div style="display:flex;gap:6px;align-items:center;margin-top:6px">${kind(t)}<span class="small muted">${t.no}</span></div><h2>${esc(t.title)}</h2><div class="acts">${actBtns()}</div></div>
  ${wide?'':stripMeta(t)}<div class="dmain"><div style="flex:1;display:flex;flex-direction:column;min-width:0"><div class="convo" style="padding:16px 28px">${convo()}</div>${composer()}</div>${wide?`<div class="meta" style="width:310px">${metaBlocks(t)}</div>`:''}</div></div>`}
 const ids=S.view==='inbox'?INBOX:T.map((_,i)=>i)
 return nav+`<div class="dcol"><div class="dhead" style="padding:14px 22px"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:18px">${S.view==='inbox'?'收件箱':'工单'}</b><span class="muted small">${ids.length} 张</span><input class="search" style="width:300px;margin-left:auto" placeholder="搜索标题、编号、标签…"></div>
 <div class="fchips">${S.view==='inbox'?'<span class="fc on">等我处理 3</span><span class="fc">访客新回复</span>':'<span class="fc on">状态：进行中</span><span class="fc">类型：全部</span><span class="fc">指派：全部</span><span class="fc">等待方：全部</span><span class="fc">标签 ▾</span><span class="fc">模板 ▾</span><span class="fc">时间 ▾</span>'}</div></div>
 <div style="flex:1;overflow:auto;padding:0 22px 22px">${table(ids,wide)}</div></div>`}
draw()
</script>
</body></html>
